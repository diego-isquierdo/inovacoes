<style>

  --serie-1:#CA8A04;--serie-2:#2563EB;--serie-3:#0D9488;--serie-4:#94A3B8;--serie-5:#1D4ED8;--serie-6:#9333EA;--serie-saida:#0369A1;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:#09090B;--foreground:#FAFAFA;--card:#18181B;--card-foreground:#FAFAFA;
  --muted:#27272A;--muted-foreground:#9CA3AF;--border:rgba(255,255,255,.10);--accent:#27272A;
  --primary:#3B82F6;--primary-foreground:#FAFAFA;--ring:#3F3F46;
  --destructive:#EF4444;--success:#22C55E;--warning:#FB923C;
  --tag-gray:#27272A;--tag-gray-fg:#9CA3AF;--tag-blue:#172554;--tag-blue-fg:#93C5FD;
  --tag-green:#052E16;--tag-green-fg:#86EFAC;--tag-orange:#431407;--tag-orange-fg:#FDBA74;
  --tag-red:#450A0A;--tag-red-fg:#FCA5A5;--tag-yellow:#422006;--tag-yellow-fg:#FDE047;
  --serie-1:#EAB308;--serie-2:#3B82F6;--serie-3:#2DD4BF;--serie-4:#64748B;--serie-5:#60A5FA;--serie-6:#C084FC;--serie-saida:#7DD3FC;color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#09090B;--foreground:#FAFAFA;--card:#18181B;--card-foreground:#FAFAFA;
  --muted:#27272A;--muted-foreground:#9CA3AF;--border:rgba(255,255,255,.10);--accent:#27272A;
  --primary:#3B82F6;--primary-foreground:#FAFAFA;--ring:#3F3F46;

  --tag-gray:#27272A;--tag-gray-fg:#9CA3AF;--tag-blue:#172554;--tag-blue-fg:#93C5FD;
  --tag-green:#052E16;--tag-green-fg:#86EFAC;--tag-orange:#431407;--tag-orange-fg:#FDBA74;

  --serie-1:#EAB308;--serie-2:#3B82F6;--serie-3:#2DD4BF;--serie-4:#64748B;--serie-5:#60A5FA;--serie-6:#C084FC;--serie-saida:#7DD3FC;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font:14px/20px var(--font);margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.ok{background:var(--tag-green);color:var(--tag-green-fg)}.chip.warn{background:var(--tag-orange);color:var(--tag-orange-fg)}
.chip.bad{background:var(--tag-red);color:var(--tag-red-fg)}.chip.info{background:var(--tag-blue);color:var(--tag-blue-fg)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--background);z-index:5}
nav.tabs button{font:500 14px/20px var(--font);color:var(--muted-foreground);background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs button:hover{color:var(--foreground)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0}

.card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:20px;min-width:0;display:flex;flex-direction:column;gap:12px}

.tblw{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}

tr:hover td{background:var(--accent)}

select,input[type=text],input[type=number],input[type=search]{font:14px var(--font);color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:8px;height:36px;padding:0 10px}
input[type=number]{width:96px;text-align:right}
.btn{font:500 14px/20px var(--font);border-radius:8px;height:36px;padding:0 14px;border:1px solid var(--border);background:var(--card);color:var(--foreground);cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn:hover{opacity:.9}.btn[disabled]{opacity:.5;cursor:not-allowed}
.find{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.find:first-of-type{border-top:0}
.find b{font-weight:500}.find p{margin:2px 0 0;color:var(--muted-foreground);font-size:13px}
.verdict{border-radius:16px;padding:20px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.verdict.bad{background:var(--tag-red)}.verdict.good{background:var(--tag-green)}.verdict.warn{background:var(--tag-orange)}
.verdict .big{font-size:20px;line-height:26px;font-weight:600}
.rules{margin:0;padding-left:18px;color:var(--muted-foreground);font-size:13px;display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--foreground);font-weight:500}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
.mono{font-family:var(--mono)}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:120px minmax(0,1fr) 56px}.wrap{padding-inline:16px}}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}

@media (max-width:900px){.hdr-r{align-items:flex-start}.upd{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

.tag.ok{background:var(--tag-green);color:var(--tag-green-fg)}.tag.warn{background:var(--tag-orange);color:var(--tag-orange-fg)}

<div class="wrap">
  <header class="top">
    <div>
      <h1>Integrações · Painel de Gestão</h1>
      <p class="sub">Projetos, sustentação, consultorias e fila de orçamento · grupo INTEGRACOES do Freshdesk e área Integração do Painel de Serviços</p>
    </div>

<script>
(function(){
"use strict";
// ---------------- estado e constantes ----------------
// Time (Painel de Serviços, área Integração). Ex-integrantes mantêm o nome nos tickets e nas horas históricas.
const TEAM_DEFAULT=["Amanda Maria Pinheiro","Elder Galvao Quirino Ribeiro","Lucas Silva Monteiro","Thais Majory de Paulo Santos"];
const EX_DEFAULT=["Ewerton Vital de Carvalho"];
const SHORT={"Amanda Maria Pinheiro":"Amanda Pinheiro","Elder Galvao Quirino Ribeiro":"Elder Ribeiro","Lucas Silva Monteiro":"Lucas Monteiro","Thais Majory de Paulo Santos":"Thais Santos","Ewerton Vital de Carvalho":"Ewerton Carvalho"};
// Famílias de demanda (campo Type do Freshdesk, definidas na extração). Projeto é o foco do painel.
const FAMS=[
  {k:"Projeto",lab:"Projetos",c:"var(--serie-2)"},
  {k:"Consultoria",lab:"Consultoria",c:"var(--serie-3)"},
  {k:"Suporte",lab:"Suporte",c:"var(--serie-1)"},
  {k:"Bug",lab:"Bugs",c:"var(--serie-6)"},
  {k:"Dúvidas",lab:"Dúvidas",c:"var(--serie-4)"},
  {k:"Orçamento",lab:"Orçamento",c:"var(--serie-5)"},
  {k:"Outros",lab:"Outros",c:"var(--muted-foreground)"},
];
const FAM_KEYS=FAMS.map(f=>f.k);
const FAM_LAB=Object.fromEntries(FAMS.map(f=>[f.k,f.lab]));
const FAM_COL=Object.fromEntries(FAMS.map(f=>[f.k,f.c]));
const CARGA=["Projeto","Consultoria","Suporte","Bug"]; // demanda do time (Dúvidas e Orçamento: volume e fila)
const FILAS=["Orçamento","Macro escopo","Especificação"];
const DEFAULT_PARAMS={time:TEAM_DEFAULT.slice(),ex:EX_DEFAULT.slice(),vencendo_dias:15,parado_dias:30,fator_produtivo:0.85,teto_backlog:0.9,horas_mes_padrao:147,ref_horas:{}};
const S={db:null,assets:null,user:null,canEdit:false,bases:null,params:JSON.parse(JSON.stringify(DEFAULT_PARAMS)),T:null,H:null,C:null,view:"geral",loadErr:null,loaded:{},ready:false,
  bl:{fam:"",st:"",dono:"",prod:"",prazo:"",escopo:"geral",q:"",limite:200},pj:{prod:"",dono:""},fila:{prod:""}};
const TABS=[["geral","Visão geral"],["proj","Projetos"],["diag","Diagnóstico"],["prazo","Prazos"],["backlog","Backlog"],["sust","Suporte e Bugs"],["cons","Consultoria"],["fila","Fila de orçamento"],["time","Time"],["horas","Horas"],["sop","S&OP"],["cfg","Configuração"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(n,d)=>(n==null||!isFinite(n))?"–":Number(n).toLocaleString("pt-BR",{maximumFractionDigits:d||0,minimumFractionDigits:d||0});
const pct=(n,d)=>(n==null||!isFinite(n))?"–":nf(n*100,d||0)+"%";
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mlab=m=>MES[+m.slice(5,7)-1]+"/"+m.slice(2,4);
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ​]/g,"").toLowerCase().trim();
const short=n=>SHORT[n]||n||"";
function toast(t){const el=$("#toast");if(!el)return;el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,4000);}
const TODAY=new Date();const curMonth=TODAY.toISOString().slice(0,7);
const dt=s=>{if(!s)return null;const d=new Date(String(s).length===10?s+"T12:00:00":s);return isNaN(d)?null:d;};
const days=(a,b)=>{const d=dt(a);return d?Math.floor(((b||TODAY)-d)/864e5):null;};
const fdia=d=>{if(!d)return "–";return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});};
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function quant(a,q){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*(s.length-1)))];}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
function addMonths(m,k){const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1));return d.toISOString().slice(0,7);}
function countBy(L,f){const o={};for(const x of L){const k=f(x);o[k]=(o[k]||0)+1;}return o;}

// ---------------- prazos (decisão do Diego, 07-08/10/2026) ----------------
// Prazo combinado = "Data limite para entrega". Data Início/Fim = execução real. Aberto: atrasado se hoje > limite sem Data Fim.
// Encerrado: no prazo quando (Data Fim | Data da entrega | resolução/fechamento) <= limite.
const PRAZO_LAB={atrasado:"Atrasado",vencendo:"Vencendo",no_prazo:"No prazo",sem_prazo:"Sem prazo definido",entregue_prazo:"Entregue no prazo",entregue_atraso:"Entregue com atraso",entregue_aberto:"Entregue (a encerrar)"};
const PRAZO_CLS={atrasado:"bad",vencendo:"warn",no_prazo:"ok",sem_prazo:"gray",entregue_prazo:"ok",entregue_atraso:"bad",entregue_aberto:"info"};
function prazoDe(t,P){
  const lim=dt(t.data_limite_entrega),fim=dt(t.data_fim)||dt(t.data_entrega);
  t.limite=lim;t.atraso=0;t.faltam=null;
  if(t.backlog_geral){
    if(!lim)return "sem_prazo";
    if(fim)return fim<=lim?"entregue_aberto":"entregue_atraso";
    const f=Math.ceil((lim-TODAY)/864e5);t.faltam=f;
    if(f<0){t.atraso=-f;return "atrasado";}
    return f<=P.vencendo_dias?"vencendo":"no_prazo";
  }
  if(t.concluido_no_ano||t.resolvido_no_ano){
    if(!lim)return "sem_prazo";
    const ref=fim||dt(t.data_resolucao)||dt(t.data_fechamento);if(!ref)return "sem_prazo";
    t.atraso=Math.max(0,Math.floor((ref-lim)/864e5));return ref<=lim?"entregue_prazo":"entregue_atraso";
  }
  return "";
}

// ---------------- carga ----------------
function rowsOf(tb){const c=tb.colunas;return tb.linhas.map(r=>{const o={};for(let i=0;i<c.length;i++)o[c[i]]=r[i];return o;});}
async function fetchAsset(id){const r=await fetch("/_blob/"+id);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
async function loadBases(){
  const b=S.bases||{};
  try{
    if(b.tickets&&b.tickets.asset&&S.loaded.tickets!==b.tickets.asset){const j=await fetchAsset(b.tickets.asset);S.Tmeta=j.meta;S.T=rowsOf(j);S.loaded.tickets=b.tickets.asset;}
    if(b.horas&&b.horas.asset&&S.loaded.horas!==b.horas.asset){const j=await fetchAsset(b.horas.asset);S.Hmeta=j.meta;S.H={};for(const k in j.tabelas)S.H[k]=rowsOf(j.tabelas[k]);S.loaded.horas=b.horas.asset;}
    S.loadErr=null;
  }catch(e){S.loadErr="Não foi possível ler uma das bases ("+e.message+"). Carregue o arquivo de novo em Configuração.";}
  compute();render();
}

// ---------------- cálculo ----------------
function compute(){
  if(!S.T){S.C=null;return;}
  const P=S.params,team=new Set((P.time||[]).map(norm)),ex=new Set((P.ex||[]).map(norm));
  const T=S.T.map(t=>{
    const n=norm(t.agente);let dono,donoTipo;
    if(!t.agente){dono="Sem responsável";donoTipo="sem";}
    else if(team.has(n)){dono=short(canon(t.agente,P.time));donoTipo="time";}
    else if(ex.has(n)){dono=short(canon(t.agente,P.ex))+" (ex)";donoTipo="ex";}
    else{dono=t.agente;donoTipo="fora";}
    const saida=t.data_resolucao||t.data_fechamento||"";
    const o={...t,dono,donoTipo,st:String(t.status||"").split(" / ")[0],idade:days(t.criado_em),parado:days(t.status_desde||t.atualizado_em),
      saida,mesEnt:(t.criado_em||"").slice(0,7),mesSai:(t.concluido_no_ano||t.resolvido_no_ano)?saida.slice(0,7):"",produto:t.produto||"Sem produto",fila:t.tipo_fila||""};
    o.est=num(t.estim_total_h)||num(t.estimativa_h)||(num(t.estim_po_dev_h)+num(t.estim_po_hml_h)+num(t.estim_po_orc_h))||null;
    o.prazo=prazoDe(o,P);
    return o;});
  const byId=new Map(T.map(t=>[String(t.id),t]));
  const BL=T.filter(t=>t.backlog_geral);
  // horas (somente área Integração) -----------------------------------------------------------
  let A=[],capM={},teamH={},hTk=new Map(),months=[];
  if(S.H){
    A=S.H["Apontamentos"]||[];
    for(const c of (S.H["Capacidade"]||[])){if(!team.has(norm(c.analyst_name)))continue;(capM[c.year_month]=capM[c.year_month]||{})[c.analyst_name]=(c.capacity_seconds||0)/3600;}
    for(const a of A){const k=String(a.ticket_id||"").trim();if(k)hTk.set(k,(hTk.get(k)||0)+(a.horas||0));}
    months=[...new Set(A.map(a=>a.mes))].sort();
  }
  for(const t of T)t.horas=hTk.get(String(t.id))||0;
  const ano=curMonth.slice(0,4),fm=[];for(let i=1;i<=+curMonth.slice(5,7);i++)fm.push(ano+"-"+String(i).padStart(2,"0"));
  const fluxo=fm.map(m=>({m,lab:mlab(m),ent:T.filter(t=>t.novo_no_ano&&t.mesEnt===m).length,sai:T.filter(t=>t.mesSai===m).length,canc:T.filter(t=>t.cancelado_no_ano&&days(t.saida||t.atualizado_em)!=null&&(t.saida||t.atualizado_em).slice(0,7)===m).length}));
  const fechados=fm.filter(m=>m<curMonth).slice(-3);
  // esforço de referência por família: mediana de horas dos encerrados no ano (ou valor definido em Configuração)
  const ref={};for(const f of FAM_KEYS){const v=T.filter(t=>t.familia===f&&(t.concluido_no_ano||t.resolvido_no_ano)&&t.horas>0).map(t=>t.horas);
    const o=(P.ref_horas||{})[f];ref[f]=o>0?{h:o,n:v.length,fonte:"definido"}:(v.length>=3?{h:median(v),n:v.length,fonte:"mediana dos encerrados"}:{h:null,n:v.length,fonte:"sem base"});}
  S.C={T,BL,byId,A,hTk,months,capM,fluxo,fechados,team,ex,ref,fm};
  for(const t of T){const r=t.est||(ref[t.familia]&&ref[t.familia].h)||0;t.esfRef=t.est?"estimativa":(r?"referência":"");t.saldo=Math.max(0,r-t.horas);}
}
function num(v){const n=+v;return isFinite(n)&&v!==""&&v!=null?n:0;}
function canon(nome,lista){const n=norm(nome);return (lista||[]).find(x=>norm(x)===n)||nome;}

// ---------------- S&OP: simulação mês a mês (modelo do ADV, LOG_SOP §5) ----------------
// Cada mês paga ao backlog no máximo `teto` da capacidade do time atual; o excedente rola para o mês seguinte.
function capacidadeMes(m){const C=S.C,P=S.params;const h=sum(Object.values(C.capM[m]||{}));return (h>0?h:C.team.size*P.horas_mes_padrao)*P.fator_produtivo;}
function demandaMedia(){const C=S.C;const o={};for(const f of CARGA){const r=C.ref[f].h||0;const n=mean(C.fechados.map(m=>C.T.filter(t=>t.novo_no_ano&&t.familia===f&&t.mesEnt===m).length))||0;o[f]={n,h:n*r,ref:C.ref[f]};}return o;}
function burndown(ativoSo){
  const C=S.C,P=S.params,dem=demandaMedia();
  const L=C.BL.filter(t=>CARGA.includes(t.familia)&&(!ativoSo||t.backlog_ativo));
  let rest=sum(L,t=>t.saldo);const h0=rest;const meses=[];let m=curMonth;const fc=sum(Object.values(dem),x=>x.h);
  for(let i=0;i<12&&(rest>0.5||i===0);i++){
    const cap=capacidadeMes(m),pago=Math.min(rest,cap*P.teto_backlog);rest-=pago;
    meses.push({m,lab:mlab(m),cap,pago,fc,rest});m=addMonths(m,1);if(i>0&&rest<=0.5)break;}
  return {h0,meses,fim:rest<=0.5?meses.length:null,fc,dem,n:L.length,semRef:L.filter(t=>!t.esfRef).length};
}

  add("warn","Projetos sem Data Início ou Data Fim","Execução real sem registro; a leitura de planejado × realizado fica incompleta.",PJ.filter(t=>!t.data_inicio||!t.data_fim));
  add("warn","Projetos sem estimativa de horas","Sem estimativa, o saldo de horas usa a mediana dos encerrados.",PJ.filter(t=>!t.est));
  add("bad","Tickets abertos de ex-integrante","Mantidos no nome do analista que saiu; avaliar reatribuição.",BL.filter(t=>t.donoTipo==="ex"));
  add("warn","Tickets abertos sem responsável","",BL.filter(t=>t.donoTipo==="sem"));
  add("info","Tickets abertos com agente de fora do time","Agentes de outros grupos atendendo tickets do grupo INTEGRACOES.",BL.filter(t=>t.donoTipo==="fora"));
  add("warn","Backlog ativo parado há mais de "+P.parado_dias+" dias","Status sem mudança.",BL.filter(t=>t.backlog_ativo&&t.parado!=null&&t.parado>P.parado_dias));
  add("warn","Tickets sem Type","Sem Type não há família; entram em Outros.",C.T.filter(t=>!t.tipo&&(t.backlog_geral||t.novo_no_ano)));
  add("info","Tipos fora das famílias do time","Erro e Falha são Bug; demais tipos gerais ficam em Outros.",BL.filter(t=>t.familia==="Outros"));
  const sh=[...(C.A||[])].filter(a=>!a.ticket_id);

}

function colChart(data,series,o){o=o||{};const W=o.w||640,Hh=o.h||220,pl=36,pr=8,pt=18,pb=26;const n=data.length;
  const lines=[...(o.line?[o.line]:[]),...(o.lines||[])];
  const mx=Math.max(1,...data.map(d=>o.stack?series.reduce((s,se)=>s+(d[se.k]||0),0):Math.max(...series.map(se=>d[se.k]||0))),...lines.map(ln=>Math.max(...data.map(d=>d[ln.k]||0))));
  const nice=niceMax(mx);const y=v=>pt+(Hh-pt-pb)*(1-v/nice);const bw=(W-pl-pr)/n;let g="";
  for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;}
  data.forEach((d,i)=>{const x0=pl+i*bw;
    if(o.stack){let acc=0;series.forEach(se=>{const v=d[se.k]||0;if(v>0){g+=`<rect x="${x0+bw*.18}" y="${y(acc+v)}" width="${bw*.64}" height="${y(acc)-y(acc+v)}" fill="${se.c}"><title>${esc(se.l)}: ${nf(v,o.dec)}</title></rect>`;}acc+=v;});
      if(acc>0||!o.hideZero)g+=`<text class="v" x="${x0+bw/2}" y="${y(acc)-4}" text-anchor="middle">${nf(acc,o.dec)}</text>`;}
    else{const sw=bw*.72/series.length;series.forEach((se,j)=>{const v=d[se.k]||0;g+=`<rect x="${x0+bw*.14+j*sw}" y="${y(v)}" width="${sw-2}" height="${y(0)-y(v)}" rx="2" fill="${se.c}"><title>${esc(se.l)}: ${nf(v,o.dec)}</title></rect>`;if(o.labels!==false)g+=`<text class="v" x="${x0+bw*.14+j*sw+(sw-2)/2}" y="${y(v)-4}" text-anchor="middle">${nf(v,o.dec)}</text>`;});}
    g+=`<text x="${x0+bw/2}" y="${Hh-8}" text-anchor="middle">${esc(d.lab)}</text>`;});
  lines.forEach(ln=>{const pts=data.map((d,i)=>`${pl+i*bw+bw/2},${y(d[ln.k]||0)}`).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${ln.c}" stroke-width="2" stroke-dasharray="5 4"/>`;data.forEach((d,i)=>{g+=`<circle cx="${pl+i*bw+bw/2}" cy="${y(d[ln.k]||0)}" r="3" fill="${ln.c}"><title>${esc(ln.l)}: ${nf(d[ln.k],o.dec)}</title></circle>`;});});
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${esc(o.aria||"gráfico")}">${g}</svg>`;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function legend(items){return `<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>`;}
function hbars(rows,o){o=o||{};const mx=Math.max(1,...rows.map(r=>r.parts?r.parts.reduce((s,p)=>s+p.v,0):r.v));
  return rows.map(r=>{const tot=r.parts?r.parts.reduce((s,p)=>s+p.v,0):r.v;const segs=(r.parts||[{v:r.v,c:o.c||"var(--primary)"}]).map(p=>`<span style="width:${p.v/mx*100}%;background:${p.c}" title="${esc(p.l||"")}: ${nf(p.v,o.dec)}"></span>`).join("");
    return `<div class="bar"><span class="t" title="${esc(r.l)}">${esc(r.l)}</span><span class="track">${segs}</span><span class="num">${nf(tot,o.dec)}${o.suf||""}</span></div>`;}).join("");}
const kpi=(l,v,d,cls)=>`<div class="kpi ${cls||""}"><span class="lab">${l}</span><span class="val">${v}</span><span class="det">${d||""}</span></div>`;
const CS="var(--serie-saida)";

// ---------------- render / eventos ----------------
function drawTabs(){$("#tabs").innerHTML=TABS.map(([v,l])=>`<button role="tab" data-v="${v}" aria-selected="${S.view===v}">${esc(l)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;try{localStorage.setItem("ig_view",S.view);}catch(e){}render();window.scrollTo(0,0);});}
function drawFresh(){const b=S.bases||{},el=$("#fresh");if(!b.tickets&&!b.horas){el.innerHTML=`<span class="chip warn">Bases não carregadas</span>`;return;}
  const c=(x,l)=>{if(!x)return `<span class="chip warn">${l}: sem carga</span>`;const g=x.gerado_em||"";const h=g?Math.floor((Date.now()-new Date(g))/36e5):null;return `<span class="chip ${h!=null&&h>30?"warn":"ok"}">${l}: ${esc(g.slice(8,10)+"/"+g.slice(5,7)+" "+g.slice(11,16))} UTC</span>`;};
  el.innerHTML=c(b.tickets,"Tickets")+c(b.horas,"Horas")+(S.C?`<span class="chip">Time: ${[...S.params.time].map(short).join(", ")}</span>`:"");}
function drawUpd(){const el=$("#upd");if(!el)return;el.innerHTML=`<span class="chip">Carga manual em Configuração</span>`;}
const VIEWS={geral:vGeral,proj:vProj,diag:vDiag,prazo:vPrazo,backlog:vBacklog,sust:vSust,cons:vCons,fila:vFila,time:vTime,horas:vHoras,sop:vSop,cfg:vCfg};
function render(){drawTabs();drawFresh();drawUpd();const m=$("#main");
  if(S.loadErr){m.innerHTML=`<section class="view"><p class="note">${esc(S.loadErr)}</p></section>`+(S.view==="cfg"?vCfg():"");bind();return;}
  if(!S.db&&S.ready){m.innerHTML=`<section class="view"><p class="note">Este painel lê as bases do banco do artefato. Abra-o no Claude, com sua conta da organização.</p></section>`;return;}
  if(!S.C){m.innerHTML=S.ready?`<section class="view"><p class="note">Nenhuma base carregada ainda. Em Configuração, carregue <span class="mono">base_integracoes.json</span> e <span class="mono">horas_integracoes_painel.json</span>.</p></section>`+(S.view==="cfg"?vCfg():""):`<section class="view"><p class="note">Carregando dados…</p></section>`;bind();return;}
  m.innerHTML=(VIEWS[S.view]||vGeral)();bind();}
function bind(){
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e[ev]=fn;};
  const setf=(o,k,id)=>on(id,"onchange",e=>{o[k]=e.target.value;if(o===S.bl)S.bl.limite=200;render();});
  ["fam","st","dono","prod","prazo"].forEach(k=>setf(S.bl,k,"f_"+k));
  setf(S.pj,"prod","pj_prod");setf(S.pj,"dono","pj_dono");setf(S.fila,"prod","fl_prod");
  document.querySelectorAll("[data-bl-esc]").forEach(b=>b.onclick=()=>{S.bl.escopo=b.dataset.blEsc;S.bl.limite=200;render();});
  on("f_q","oninput",e=>{clearTimeout(bind._q);const v=e.target.value;bind._q=setTimeout(()=>{S.bl.q=v;render();const n=$("#f_q");if(n){n.focus();n.setSelectionRange(v.length,v.length);}},300);});
  on("f_more","onclick",()=>{S.bl.limite+=300;render();});
  on("f_csv","onclick",exportCsv);on("p_save","onclick",saveParams);on("up_file","onchange",e=>upload(e.target.files[0]));
}
async function exportCsv(){const dl=await window.claude?.use?.("downloads");if(!dl){toast("Download indisponível nesta visualização.");return;}
  const L=blFiltered();const head=["Ticket","Assunto","Família","Fila","Produto","Status","Responsável","Situação","Prazo","Data limite","Dias de atraso","Idade (dias)","Parado (dias)","Horas apontadas","Estimativa (h)"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv="﻿"+[head.join(";")].concat(L.map(t=>[t.id,t.assunto,FAM_LAB[t.familia],t.fila,t.produto,t.st,t.dono,t.suspenso?"Suspenso":"Ativo",PRAZO_LAB[t.prazo]||"",t.limite?t.limite.toISOString().slice(0,10):"",t.atraso||"",t.idade,t.parado,String(t.horas.toFixed(2)).replace(".",","),t.est||""].map(q).join(";"))).join("\r\n");
  try{await dl.save({filename:"backlog_integracoes.csv",data:new Blob([csv],{type:"text/csv"})});}catch(e){toast("Download não concluído.");}}
async function saveParams(){if(!S.db)return;const g=id=>+document.getElementById(id).value;
  const time=[],ex=[];document.querySelectorAll("select[id^=tm_]").forEach(s=>{if(s.value==="time")time.push(s.dataset.n);else if(s.value==="ex")ex.push(s.dataset.n);});
  if(!time.length){toast("Selecione ao menos uma pessoa no time atual.");return;}
  const ref={};document.querySelectorAll("input[id^=rf_]").forEach(i=>{const v=+i.value;if(v>0)ref[i.dataset.f]=v;});
  const p={...S.params,time,ex,ref_horas:ref,vencendo_dias:Math.max(1,g("p_vd")||15),parado_dias:Math.max(5,g("p_pd")||30),fator_produtivo:Math.min(1,Math.max(0.1,g("p_fp")/100||0.85)),teto_backlog:Math.min(1,Math.max(0.3,g("p_tb")/100||0.9)),horas_mes_padrao:g("p_hp")||147,atualizado_em:new Date().toISOString()};
  try{await S.db.doc("cfg/params").set(p);toast("Parâmetros salvos");}catch(e){toast(e&&e.code==="invalid_argument"?"Você não tem permissão para alterar os parâmetros.":"Não foi possível salvar. Tente de novo.");}}
async function upload(file){if(!file||!S.assets||!S.db)return;
  let j;try{j=JSON.parse(await file.text());}catch(e){toast("O arquivo não é um JSON válido.");return;}
  const kind=j.tabelas&&j.tabelas["Apontamentos"]?"horas":(j.colunas&&j.linhas?"tickets":null);
  if(!kind){toast("Arquivo não reconhecido. Use base_integracoes.json ou horas_integracoes_painel.json.");return;}
  toast("Enviando "+(kind==="horas"?"base de horas":"base de tickets")+"…");
  try{const r=await S.assets.upload(file,{type:"application/json"});const old=(S.bases||{})[kind];
    const meta=j.meta||{};const linhas=kind==="horas"?(j.tabelas["Apontamentos"].linhas||[]).length:j.linhas.length;
    const doc={...(S.bases||{}),[kind]:{asset:r.id,gerado_em:meta.gerado_em||"",linhas,enviado_em:new Date().toISOString(),arquivo:file.name}};
    await S.db.doc("cfg/bases").set(doc);
    if(old&&old.asset&&old.asset!==r.id){try{await S.assets.delete(old.asset);}catch(e){}}
    toast("Base carregada");}
  catch(e){toast({too_large:"Arquivo acima de 20 MB.",rate_limited:"Muitas tentativas; aguarde um pouco.",not_granted:"Sem permissão para carregar arquivos."}[e&&e.code]||"Não foi possível carregar o arquivo.");}}

// ---------------- boot ----------------
try{const v=localStorage.getItem("ig_view");if(v&&TABS.some(t=>t[0]===v))S.view=v;}catch(e){}
if(/^#[a-z]+$/.test(location.hash)&&TABS.some(t=>"#"+t[0]===location.hash))S.view=location.hash.slice(1);
render();
(async function boot(){const c=window.claude;
  const [db,user]=await Promise.all([c?.use?.("db")??null,c?.use?.("user")??null]);
  S.db=db;S.user=user;S.ready=true;
  if(user){try{S.canEdit=await user.canEdit();}catch(e){}}
  if(S.canEdit){c?.use?.("assets").then(a=>{S.assets=a;if(S.view==="cfg")render();}).catch(()=>{});}
  if(!db){render();return;}
  db.doc("cfg/params").onSnapshot(s=>{S.params=s.exists?{...JSON.parse(JSON.stringify(DEFAULT_PARAMS)),...s.data()}:JSON.parse(JSON.stringify(DEFAULT_PARAMS));if(S.T){compute();}render();},()=>{});
  db.doc("cfg/bases").onSnapshot(s=>{S.bases=s.exists?s.data():null;loadBases();},()=>{S.loadErr="Não foi possível ler o banco do painel.";render();});
})();
})();
</script>
