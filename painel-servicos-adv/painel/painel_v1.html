<style>

  --tag-red:#FEE2E2;--tag-red-fg:#B91C1C;--tag-yellow:#FEF9C3;--tag-yellow-fg:#A16207;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --muted:#27272A;--muted-foreground:#9CA3AF;--border:rgba(255,255,255,.10);--accent:#27272A;

  --destructive:#EF4444;--success:#22C55E;--warning:#FB923C;
  --tag-gray:#27272A;--tag-gray-fg:#9CA3AF;--tag-blue:#172554;--tag-blue-fg:#93C5FD;
  --tag-green:#052E16;--tag-green-fg:#86EFAC;--tag-orange:#431407;--tag-orange-fg:#FDBA74;
  --tag-red:#450A0A;--tag-red-fg:#FCA5A5;--tag-yellow:#422006;--tag-yellow-fg:#FDE047;
  --serie-1:#EAB308;--serie-2:#3B82F6;--serie-3:#2DD4BF;--serie-4:#64748B;--serie-5:#60A5FA;--serie-6:#C084FC;--serie-saida:#7DD3FC;color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#09090B;--foreground:#FAFAFA;--card:#18181B;--card-foreground:#FAFAFA;
  --muted:#27272A;--muted-foreground:#9CA3AF;--border:rgba(255,255,255,.10);--accent:#27272A;
  --primary:#3B82F6;--primary-foreground:#FAFAFA;--ring:#3F3F46;
  --destructive:#EF4444;--success:#22C55E;--warning:#FB923C;
  --tag-gray:#27272A;--tag-gray-fg:#9CA3AF;--tag-blue:#172554;--tag-blue-fg:#93C5FD;
  --tag-green:#052E16;--tag-green-fg:#86EFAC;--tag-orange:#431407;--tag-orange-fg:#FDBA74;
  --tag-red:#450A0A;--tag-red-fg:#FCA5A5;--tag-yellow:#422006;--tag-yellow-fg:#FDE047;
  --serie-1:#EAB308;--serie-2:#3B82F6;--serie-3:#2DD4BF;--serie-4:#64748B;--serie-5:#60A5FA;--serie-6:#C084FC;--serie-saida:#7DD3FC;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font:14px/20px var(--font);margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}
h1{font-size:24px;line-height:28px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted-foreground);font-size:14px;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:500;background:var(--tag-gray);color:var(--tag-gray-fg);white-space:nowrap}
.chip.ok{background:var(--tag-green);color:var(--tag-green-fg)}.chip.warn{background:var(--tag-orange);color:var(--tag-orange-fg)}
.chip.bad{background:var(--tag-red);color:var(--tag-red-fg)}.chip.info{background:var(--tag-blue);color:var(--tag-blue-fg)}
.chip.y{background:var(--tag-yellow);color:var(--tag-yellow-fg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--background);z-index:5}
nav.tabs button{font:500 14px/20px var(--font);color:var(--muted-foreground);background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs button:hover{color:var(--foreground)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0}

.kpi .val{font-size:26px;line-height:30px;font-weight:600;font-variant-numeric:tabular-nums}

.kpi.bad .val{color:var(--destructive)}.kpi.good .val{color:var(--success)}
.card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;line-height:24px;font-weight:500;margin:0}

svg .v{fill:var(--foreground);font-weight:500}
.tblw{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--muted);color:var(--muted-foreground);font-weight:500;text-align:left;padding:8px 12px;white-space:nowrap;position:sticky;top:0}

td.n,th.n{text-align:right}td.n{white-space:nowrap}
tr:hover td{background:var(--accent)}
a{color:var(--primary)}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:14px;background:var(--muted);border-radius:4px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.bar .num{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
select,input[type=text],input[type=number],input[type=search]{font:14px var(--font);color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:8px;height:36px;padding:0 10px}
input[type=number]{width:96px;text-align:right}
.btn{font:500 14px/20px var(--font);border-radius:8px;height:36px;padding:0 14px;border:1px solid var(--border);background:var(--card);color:var(--foreground);cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn:hover{opacity:.9}.btn[disabled]{opacity:.5;cursor:not-allowed}
.find{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.find:first-of-type{border-top:0}
.find b{font-weight:500}.find p{margin:2px 0 0;color:var(--muted-foreground);font-size:13px}
.verdict{border-radius:16px;padding:20px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.verdict.bad{background:var(--tag-red)}.verdict.good{background:var(--tag-green)}.verdict.warn{background:var(--tag-orange)}
.verdict .big{font-size:20px;line-height:26px;font-weight:600}
.rules{margin:0;padding-left:18px;color:var(--muted-foreground);font-size:13px;display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--foreground);font-weight:500}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
.mono{font-family:var(--mono)}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:120px minmax(0,1fr) 56px}.wrap{padding-inline:16px}}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}

.upd .det{font-size:12px;line-height:16px;color:var(--muted-foreground)}
@media (max-width:900px){.hdr-r{align-items:flex-start}.upd{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap">
  <header class="top">
    <div>
      <h1>Serviços ADV · Painel de Gestão</h1>
      <p class="sub">Fila, saúde do time, horas apontadas e S&amp;OP · grupo SRV TECNICO, produto Projuris ADV</p>
    </div>
    <div class="hdr-r">
      <div class="upd" id="upd" aria-live="polite"></div>
      <div class="chips" id="fresh"><span class="chip">Carregando bases…</span></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do painel"></nav>
  <main id="main"><section class="view"><p class="note">Carregando dados…</p></section></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
// ---------------- estado ----------------
const TEAM_DEFAULT=["Renan Miguel Thomas","Marina Cristina Soares Esteves","Lucas Schwartz dos Santos","Wallef Igor Franco Amorim"];
const SHORT={"Renan Miguel Thomas":"Renan Thomas","Marina Cristina Soares Esteves":"Marina Esteves","Lucas Schwartz dos Santos":"Lucas Santos","Wallef Igor Franco Amorim":"Wallef Amorim","Andrei Luis Rhoden":"Andrei Rhoden","Livia Diniz Fernandes":"Livia Fernandes"};
// Categorias de demanda do time de Serviços ADV (confirmadas com o Diego em 01-02/10/2026).
// Migração (mapeados/não mapeados) tem esforço por anexo: "sem anexos" ou "com anexos" (tag do Freshdesk).
const CATS=[
  {k:"orcamento",lab:"Viabilidade/Orçamento",esf:2,sla:3},
  {k:"imp_dados",lab:"Importação de Dados",esf:29,sla:3},
  {k:"imp_doc",lab:"Importação de Documentos",esf:29,sla:3},
  {k:"lote_script",lab:"Ações em Lote / Scripts",esf:10,sla:10},
  {k:"migr_mapeado",lab:"Migração · Sistemas Mapeados",esfSem:29,esfCom:55,sla:40},
  {k:"migr_nmapeado",lab:"Migração · Sistemas Não Mapeados",esfSem:29,esfCom:55,sla:60},
];
const CAT_KEYS=CATS.map(c=>c.k);
const CAT_LAB=Object.fromEntries(CATS.map(c=>[c.k,c.lab]));
CAT_LAB.interno="Atividades Internas";
const CAT_BY_K=Object.fromEntries(CATS.map(c=>[c.k,c]));
const CAT_COL={orcamento:"var(--serie-1)",imp_dados:"var(--serie-2)",imp_doc:"var(--serie-3)",lote_script:"var(--serie-4)",migr_mapeado:"var(--serie-5)",migr_nmapeado:"var(--serie-6)",interno:"var(--muted-foreground)"};
const ESF_DEF={};for(const c of CATS)ESF_DEF[c.k]=c.esf!=null?c.esf:{sem:c.esfSem,com:c.esfCom};
const SLA_DIAS_DEF={};for(const c of CATS)SLA_DIAS_DEF[c.k]=c.sla;
const DEFAULT_PARAMS={esforco:JSON.parse(JSON.stringify(ESF_DEF)),fator_produtivo:0.85,meta_ocupacao:0.8,cenario:"total",time:TEAM_DEFAULT.slice(),horas_mes_padrao:147};
const S={db:null,assets:null,user:null,canEdit:false,bases:null,params:JSON.parse(JSON.stringify(DEFAULT_PARAMS)),T:null,H:null,C:null,view:"geral",loadErr:null,blFilter:{cat:"",sla:"",dono:"",status:"",q:"",limite:200},sa:{cen:"total",modo:"squad",atual:"prev"},loaded:{}};
const TABS=[["geral","Visão geral"],["diag","Diagnóstico da operação"],["sla","SLA"],["backlog","Backlog"],["time","Time"],["horas","Horas"],["sop","S&OP geral"],["sopa","S&OP por Analista"],["acao","Plano de Ação"],["cfg","Configuração"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(n,d)=>(n==null||!isFinite(n))?"–":Number(n).toLocaleString("pt-BR",{maximumFractionDigits:d||0,minimumFractionDigits:d||0});
const pct=(n,d)=>(n==null||!isFinite(n))?"–":nf(n*100,d||0)+"%";
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mlab=m=>MES[+m.slice(5,7)-1]+"/"+m.slice(2,4);
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const short=n=>SHORT[n]||n||"";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,4000);}
const TODAY=new Date();const curMonth=TODAY.toISOString().slice(0,7);
const days=(a,b)=>Math.floor(((b||TODAY)-new Date(a))/864e5);
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function quant(a,q){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*(s.length-1)))];}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function addMonths(m,k){const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1));return d.toISOString().slice(0,7);}
const fdia=ms=>{if(ms==null)return "–";const d=new Date(ms);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});};

// ---------------- classificação em 6 categorias (+ interno, fora do SLA) ----------------
// Ordem de precisão: 1) Subtipo  2) Tags  3) Assunto/Tipo  4) Padrão (ambíguo, fica marcado p/ revisão)
// Migração (mapeado/não mapeado) herda também o Subtipo "Ajustes de inconsistências" e "Migração" (genérico),
// que não trazem a palavra mapeado/não mapeado — nesses, tags e depois assunto decidem; sem nenhuma pista,
// cai em "Não Mapeados" (SLA mais longo, leitura conservadora) e fica marcado como "Padrão" no Backlog/Diagnóstico.
function anexoDe(tg){if(/com anexos/.test(tg))return true;if(/sem anexos/.test(tg))return false;return null;}
function mapeadoDe(s){if(/nao mapead|não mapead/.test(s))return false;if(/mapead/.test(s))return true;return null;}
function classifica(t){
  const st=norm(t.subtipo),tg=norm(t.tags),as=norm(t.assunto),tp=norm(t.tipo);
  const anexo=anexoDe(tg);
  if(/nao mapead|não mapead/.test(st))return{cat:"migr_nmapeado",regra:"Subtipo",anexo};
  if(/mapead/.test(st))return{cat:"migr_mapeado",regra:"Subtipo",anexo};
  if(/script|acao em lote|ação em lote/.test(st))return{cat:"lote_script",regra:"Subtipo",anexo};
  if(/documento|arquivo/.test(st))return{cat:"imp_doc",regra:"Subtipo",anexo};
  if(/importacao de dados|importação de dados/.test(st))return{cat:"imp_dados",regra:"Subtipo",anexo};
  if(/atividade.*interna/.test(st))return{cat:"interno",regra:"Subtipo",anexo};
  if(/ajuste.*inconsist|^migra|migracao|migração/.test(st)){
    const m=mapeadoDe(tg);if(m!=null)return{cat:m?"migr_mapeado":"migr_nmapeado",regra:"Tags",anexo};
    const ma=mapeadoDe(as);if(ma!=null)return{cat:ma?"migr_mapeado":"migr_nmapeado",regra:"Assunto",anexo};
    return{cat:"migr_nmapeado",regra:"Padrão",anexo};
  }
  if(!st.trim()){
    if(/orcamento|orçamento|duvida|dúvida/.test(tp))return{cat:"orcamento",regra:"Tipo",anexo};
    const m=mapeadoDe(tg);if(m!=null)return{cat:m?"migr_mapeado":"migr_nmapeado",regra:"Tags",anexo};
    if(/script/.test(as))return{cat:"lote_script",regra:"Assunto",anexo};
    if(/migra/.test(as)){const ma=mapeadoDe(as);return{cat:ma===false?"migr_nmapeado":"migr_mapeado",regra:"Assunto",anexo};}
    if(/import/.test(as))return{cat:"imp_dados",regra:"Assunto",anexo};
    return{cat:"orcamento",regra:"Padrão",anexo};
  }
  return{cat:"orcamento",regra:"Padrão",anexo};
}
const JANELA_REAL=60;
// Fase 7.1 — SLA em dias corridos desde a abertura, sem pausa
function slaCfg(){const s=(S.params&&S.params.sla)||{};return {dias:{...SLA_DIAS_DEF,...(s.dias||{})},proximo:s.proximo!=null?+s.proximo:0.25};}
const SLA_LAB={dentro:"Dentro do SLA",proximo:"Próximo do vencimento",vencido:"SLA vencido",no_prazo:"Concluído no prazo",fora_prazo:"Concluído fora do prazo"};
const SLA_CLS={dentro:"ok",proximo:"warn",vencido:"bad",no_prazo:"ok",fora_prazo:"bad"};
function slaResumo(L){const r={n:L.length,dentro:0,proximo:0,vencido:0,vencAtivo:0,vencTerc:0,saldo:0,atrasos:[]};
  for(const t of L){if(r[t.sla]!=null)r[t.sla]++;r.saldo+=t.saldo||0;if(t.sla==="vencido"){r.atrasos.push(t.atraso);if(t.ativo)r.vencAtivo++;else r.vencTerc++;}}
  r.atrasoMed=median(r.atrasos);r.pVenc=r.n?r.vencido/r.n:null;r.pDentro=r.n?r.dentro/r.n:null;return r;}

// ---------------- carga ----------------
function rowsOf(tb){const c=tb.colunas;return tb.linhas.map(r=>{const o={};for(let i=0;i<c.length;i++)o[c[i]]=r[i];return o;});}
async function fetchAsset(id){const r=await fetch("/_blob/"+id);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
async function loadBases(){
  const b=S.bases||{};
  try{
    if(b.tickets&&b.tickets.asset&&S.loaded.tickets!==b.tickets.asset){const j=await fetchAsset(b.tickets.asset);S.Tmeta=j.meta;S.T=rowsOf(j);S.loaded.tickets=b.tickets.asset;}
    if(b.horas&&b.horas.asset&&S.loaded.horas!==b.horas.asset){const j=await fetchAsset(b.horas.asset);S.Hmeta=j.meta;S.H={};for(const k in j.tabelas)S.H[k]=rowsOf(j.tabelas[k]);S.loaded.horas=b.horas.asset;}
    S.loadErr=null;
  }catch(e){S.loadErr="Não foi possível ler uma das bases ("+e.message+"). Carregue o arquivo de novo em Configuração.";}
  compute();render();
}

// ---------------- esforço padrão e mistura histórica de anexos (migração) ----------------
function esforcoPadrao(cat){const e=S.params.esforco[cat];return typeof e==="object"?e:{sem:e,com:e};}
// esforço de um ticket já classificado (anexo true/com, false/sem, null -> trata como sem, a leitura mais comum)
function esforcoT(t){const e=esforcoPadrao(t.cat);return t.anexo===true?e.com:e.sem;}
// para prever entradas futuras (ainda sem anexo conhecido), usa a mistura real histórica da categoria
function mixAnexo(cat){const C=S.C,v=C.T.filter(t=>t.cat===cat&&t.anexo!=null);if(!v.length)return 0;return v.filter(t=>t.anexo).length/v.length;}
function esforcoMedioCat(cat){const e=esforcoPadrao(cat);if(e.sem===e.com)return e.sem;const p=S.C.mixAnexo[cat]||0;return e.sem+(e.com-e.sem)*p;}
function esforco(cat){return esforcoMedioCat(cat);}
function entHTipo(cat){return (S.C.entMed[cat]||0)*esforcoMedioCat(cat);}
// Backlog fora da mão do time: depende do cliente, suspenso, com fornecedor ou cancelado
const FORA_RE=/aguardando cliente|validacao do cliente|suspenso|fornecedor|cancelado/;
const isAtivo=t=>!FORA_RE.test(norm(t.st));
const CEN={total:"backlog total",ativo:"backlog ativo"};
const cenKey=()=>S.params.cenario==="ativo"?"ativo":"total";

// ---------------- cálculo ----------------
function compute(){
  if(!S.T){S.C=null;return;}
  const P=S.params,team=new Set(P.time||TEAM_DEFAULT);
  const T=S.T.map(t=>{const{cat,regra,anexo}=classifica(t);
    const saida=t.data_resolucao||t.data_fechamento||"";
    return {...t,cat,regra,anexo,dono:team.has(t.agente)?short(t.agente):"Sem responsável ativo",donoFull:t.agente,
      idade:days(t.criado_em),parado:days(t.atualizado_em),st:String(t.status||"").split(" / ")[0],
      saida,mesEnt:(t.criado_em||"").slice(0,7),mesSai:saida.slice(0,7)};});
  const byId=new Map(T.map(t=>[String(t.id),t]));
  const BL=T.filter(t=>t.backlog);
  let A=[],months=[],teamH={},capM={},fech=[],ref=[];
  if(S.H){
    A=S.H["Apontamentos"]||[];
    for(const a of A){if(!team.has(a.analyst_name))continue;(teamH[a.mes]=teamH[a.mes]||{})[a.analyst_name]=((teamH[a.mes]||{})[a.analyst_name]||0)+(a.horas||0);}
    for(const c of (S.H["Capacidade"]||[])){if(!team.has(c.analyst_name))continue;(capM[c.year_month]=capM[c.year_month]||{})[c.analyst_name]=(c.capacity_seconds||0)/3600;}
    months=[...new Set(A.map(a=>a.mes))].sort();
    fech=(S.H["Fechamento - Analistas"]||[]).filter(f=>team.has(f.analyst_name));
    for(const m of months){const h=Object.values(teamH[m]||{}).reduce((s,x)=>s+x,0);const c=Object.values(capM[m]||{}).reduce((s,x)=>s+x,0)||team.size*P.horas_mes_padrao;if(h>=0.5*c&&m<curMonth)ref.push(m);}
    ref=ref.slice(-3);
  }
  const hTk=new Map();for(const a of A){const k=String(a.ticket_id||"").trim();if(k&&byId.has(k))hTk.set(k,(hTk.get(k)||0)+(a.horas||0));}
  for(const t of T)t.horas=hTk.get(String(t.id))||0;
  const ano=curMonth.slice(0,4);const fm=[];for(let i=1;i<=+curMonth.slice(5,7);i++)fm.push(ano+"-"+String(i).padStart(2,"0"));
  const fluxo=fm.map(m=>{const o={m,sai:T.filter(t=>t.mesSai===m).length};for(const k of CAT_KEYS)o[k]=T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.cat===k).length;return o;});
  const fechados=fm.filter(m=>m<curMonth).slice(-3);
  const entMed={};for(const k of CAT_KEYS)entMed[k]=mean(fechados.map(m=>T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.cat===k).length))||0;
  const saiMed=mean(fechados.map(m=>T.filter(t=>t.mesSai===m).length))||0;
  const mixAnexo={};for(const k of CAT_KEYS)mixAnexo[k]=(function(){const v=T.filter(t=>t.cat===k&&t.anexo!=null);return v.length?v.filter(t=>t.anexo).length/v.length:0;})();
  S.C={T,BL,byId,A,hTk,months,teamH,capM,fech,ref,fluxo,fechados,entMed,saiMed,team,mixAnexo};
  const SC=slaCfg(),agora=Date.now();
  for(const t of T){
    t.ativo=t.backlog?isAtivo(t):false;
    t.esf=t.cat==="interno"?0:esforcoT(t);t.saldo=Math.max(0,t.esf-t.horas);
    if(t.cat==="interno"){t.sla="sem_data";continue;}
    t.slaDias=SC.dias[t.cat];const ab=new Date(t.criado_em).getTime();
    t.limite=isNaN(ab)?null:ab+t.slaDias*864e5;t.atraso=0;
    if(t.limite==null)t.sla="sem_data";
    else if(t.backlog){const falta=t.limite-agora;t.atraso=Math.max(0,-falta/864e5);t.sla=falta<0?"vencido":(falta<=t.slaDias*SC.proximo*864e5?"proximo":"dentro");}
    else if(t.saida){const sd=new Date(t.saida).getTime();t.atraso=Math.max(0,(sd-t.limite)/864e5);t.sla=sd<=t.limite?"no_prazo":"fora_prazo";}
    else t.sla="sem_data";
  }
  S.C.slaCfg=SC;
  S.C.sop=sop();
}
const SAFETY_MESES=6;
// S&OP: simulação mês a mês até o backlog zerar (ou até SAFETY_MESES, por segurança).
// Cada mês paga ao backlog no máximo 90% da capacidade do mês; o que sobra do backlog
// vai para o mês seguinte. O Forecast (entradas previstas) fica fora dessa conta — é só
// contexto, porque pode passar da capacidade: não há garantia de que essas entradas se confirmem.
function burndown(members,cats,cen){
  const C=S.C,P=S.params;const mem=[...members];
  const BLall=C.BL.filter(t=>cats.includes(t.cat));const BLt=cen==="ativo"?BLall.filter(isAtivo):BLall;
  let restante=BLt.reduce((s,t)=>s+Math.max(0,t.esf-t.horas),0);
  const blH0=restante;
  const entH=cats.reduce((s,k)=>s+entHTipo(k),0);
  const meses=[];let zerou=null;
  for(let i=0;i<SAFETY_MESES;i++){
    const m=addMonths(curMonth,i);
    const cap=mem.reduce((s,n)=>s+(((C.capM[m]||{})[n])||P.horas_mes_padrao),0)*(+P.fator_produtivo||0.85);
    const capBL=cap*0.9;
    const pago=Math.min(capBL,restante);
    restante-=pago;
    meses.push({m,cap,capBL,pago,restante,forecast:entH});
    if(restante<=0.01){zerou=i;break;}
  }
  const capMedio=meses.length?mean(meses.map(x=>x.cap)):(P.horas_mes_padrao*(+P.fator_produtivo||0.85));
  const capFTE=mem.length?capMedio/mem.length:capMedio;
  const extraFTE=(zerou==null&&meses.length)?(meses[meses.length-1].restante/SAFETY_MESES)/capFTE:0;
  return {meses,blH0,entH,zerou,capMedio,capFTE,fteAtual:mem.length,extraFTE,
    nBL:BLt.length,nFora:BLall.length-BLt.length,cats,membros:mem,cen};
}
function sop(){const out={};for(const cen of ["total","ativo"])out[cen]=burndown(S.C.team,CAT_KEYS,cen);return out;}

// ---------------- S&OP · projeção viva (realista) ----------------
// Diferença para a simulação acima: aqui pelo menos metade do Forecast de cada mês
// entra de fato na fila (vira backlog), em vez de ficar só como contexto. A régua de
// parada também muda: não é "zerar o backlog", é "o backlog cair para metade da
// capacidade mensal" — uma fila saudável, não uma fila vazia. Horizonte de até 12 meses.
const MAX_MESES_VIVO=12,FORECAST_MIN=0.5;
function burndownVivo(members,cats,cen){
  const C=S.C,P=S.params;const mem=[...members];
  const BLall=C.BL.filter(t=>cats.includes(t.cat));const BLt=cen==="ativo"?BLall.filter(isAtivo):BLall;
  let restante=BLt.reduce((s,t)=>s+Math.max(0,t.esf-t.horas),0);
  const blH0=restante;
  const entH=cats.reduce((s,k)=>s+entHTipo(k),0);
  const meses=[];let atingiu=null;
  for(let i=0;i<MAX_MESES_VIVO;i++){
    const m=addMonths(curMonth,i);
    const cap=mem.reduce((s,n)=>s+(((C.capM[m]||{})[n])||P.horas_mes_padrao),0)*(+P.fator_produtivo||0.85);
    const capBL=cap*0.9,meta=cap*0.5;
    const entra=entH*FORECAST_MIN;
    const restanteAntes=restante;
    const fila=restanteAntes+entra;
    const pago=Math.min(capBL,fila);
    // prioridade: paga o backlog antigo primeiro; a sobra de capacidade, se houver, ataca a demanda nova do mês
    const pagoAntigo=Math.min(pago,restanteAntes);
    const pagoNovo=pago-pagoAntigo;
    const restanteAntigo=restanteAntes-pagoAntigo;
    const restanteNovo=entra-pagoNovo;
    restante=restanteAntigo+restanteNovo;
    meses.push({m,cap,capBL,meta,entra,fila,pago,restante,restanteAntigo,restanteNovo});
    if(restante<=meta){atingiu=i;break;}
  }
  const capMedio=meses.length?mean(meses.map(x=>x.cap)):(P.horas_mes_padrao*(+P.fator_produtivo||0.85));
  const capFTE=mem.length?capMedio/mem.length:capMedio;
  return {meses,blH0,entH,atingiu,capMedio,capFTE,fteAtual:mem.length,nBL:BLt.length,nFora:BLall.length-BLt.length,cen};
}
function sopVivo(){const out={};for(const cen of ["total","ativo"])out[cen]=burndownVivo(S.C.team,CAT_KEYS,cen);return out;}

  const ult=x.meses[x.meses.length-1];
  return `<div class="card"><h2>${t}</h2><p class="hint">${nf(x.nBL)} tickets no backlog hoje (${nf(x.blH0)} h)${x.nFora?` (sem ${nf(x.nFora)} que dependem do cliente ou de terceiros)`:""} · a cada mês, pelo menos metade do Forecast (${nf(x.entH*FORECAST_MIN)} h de ${nf(x.entH)} h) entra de fato na fila</p>
   <div class="kpis" style="margin:0">
    ${kpi("Backlog cai para metade da capacidade em",x.atingiu!=null?nf(x.atingiu+1)+" meses":`+${MAX_MESES_VIVO} meses`,x.atingiu!=null?`meta: ${nf(ult.meta)} h (50% da capacidade do mês)`:`ainda em ${nf(ult.restante)} h no mês ${MAX_MESES_VIVO} (meta ${nf(ult.meta)} h)`,x.atingiu==null?"bad":"good")}

   ${colChart(chartData,[{k:"pago",c:"var(--primary)",l:"Pago ao backlog"},{k:"novo",c:"var(--serie-3)",l:"Metade do Forecast ainda na fila"},{k:"antigo",c:"var(--serie-6)",l:"Backlog antigo ainda na fila"}],{stack:true,lines:[{k:"cap",c:"var(--destructive)",l:"Capacidade"},{k:"meta",c:"var(--warning)",l:"Meta (50%)"}],h:220,aria:"Pago ao backlog, forecast ainda na fila e backlog antigo ainda na fila, por mês, com capacidade e meta de referência"})}
   <p class="hint" style="margin:0">Só a fatia do Forecast (laranja-azulado) pode fazer a barra passar da linha de capacidade — o restante é sempre limitado a 90% da capacidade do mês.</p>

    ${x.meses.map(mm=>`<tr${mm.restante<=mm.meta?' style="background:color-mix(in srgb,var(--tag-green) 35%,transparent)"':""}><td>${mlab(mm.m)}</td><td class="n">${nf(mm.cap)} h</td><td class="n">${nf(mm.entra)} h</td><td class="n">${nf(mm.fila)} h</td><td class="n">${nf(mm.pago)} h</td><td class="n">${nf(mm.restanteNovo)} h</td><td class="n">${nf(mm.restanteAntigo)} h</td><td class="n">${nf(mm.restante)} h</td><td class="n">${nf(mm.meta)} h</td></tr>`).join("")}
   </tbody></table></div>
  </div>`;

// ---------------- gráficos (SVG em escala) ----------------
function colChart(data,series,o){o=o||{};const W=o.w||640,Hh=o.h||220,pl=36,pr=8,pt=18,pb=26;const n=data.length;
  const lines=[...(o.line?[o.line]:[]),...(o.lines||[])];
  const mx=Math.max(1,...data.map(d=>o.stack?series.reduce((s,se)=>s+(d[se.k]||0),0):Math.max(...series.map(se=>d[se.k]||0))),...lines.map(ln=>Math.max(...data.map(d=>d[ln.k]||0))));
  const nice=niceMax(mx);const y=v=>pt+(Hh-pt-pb)*(1-v/nice);const bw=(W-pl-pr)/n;let g="";
  for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;}
  data.forEach((d,i)=>{const x0=pl+i*bw;
    if(o.stack){let acc=0;series.forEach(se=>{const v=d[se.k]||0;if(v>0){g+=`<rect x="${x0+bw*.18}" y="${y(acc+v)}" width="${bw*.64}" height="${y(acc)-y(acc+v)}" fill="${se.c}"><title>${esc(se.l)}: ${nf(v,o.dec)}</title></rect>`;}acc+=v;});
      if(acc>0||!o.hideZero)g+=`<text class="v" x="${x0+bw/2}" y="${y(acc)-4}" text-anchor="middle">${nf(acc,o.dec)}</text>`;}
    else{const sw=bw*.72/series.length;series.forEach((se,j)=>{const v=d[se.k]||0;g+=`<rect x="${x0+bw*.14+j*sw}" y="${y(v)}" width="${sw-2}" height="${y(0)-y(v)}" rx="2" fill="${se.c}"><title>${esc(se.l)}: ${nf(v,o.dec)}</title></rect>`;if(o.labels!==false)g+=`<text class="v" x="${x0+bw*.14+j*sw+(sw-2)/2}" y="${y(v)-4}" text-anchor="middle">${nf(v,o.dec)}</text>`;});}
    g+=`<text x="${x0+bw/2}" y="${Hh-8}" text-anchor="middle">${esc(d.lab)}</text>`;});
  lines.forEach(ln=>{const pts=data.map((d,i)=>`${pl+i*bw+bw/2},${y(d[ln.k]||0)}`).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${ln.c}" stroke-width="2" stroke-dasharray="5 4"/>`;data.forEach((d,i)=>{g+=`<circle cx="${pl+i*bw+bw/2}" cy="${y(d[ln.k]||0)}" r="3" fill="${ln.c}"><title>${esc(ln.l)}: ${nf(d[ln.k],o.dec)}</title></circle>`;});});
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${esc(o.aria||"gráfico")}">${g}</svg>`;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function legend(items){return `<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>`;}
function hbars(rows,o){o=o||{};const mx=Math.max(1,...rows.map(r=>r.parts?r.parts.reduce((s,p)=>s+p.v,0):r.v));
  return rows.map(r=>{const tot=r.parts?r.parts.reduce((s,p)=>s+p.v,0):r.v;const segs=(r.parts||[{v:r.v,c:o.c||"var(--primary)"}]).map(p=>`<span style="width:${p.v/mx*100}%;background:${p.c}" title="${esc(p.l||"")}: ${nf(p.v,o.dec)}"></span>`).join("");
    return `<div class="bar"><span class="t" title="${esc(r.l)}">${esc(r.l)}</span><span class="track">${segs}</span><span class="num">${nf(tot,o.dec)}${o.suf||""}</span></div>`;}).join("");}
const kpi=(l,v,d,cls)=>`<div class="kpi ${cls||""}"><span class="lab">${l}</span><span class="val">${v}</span><span class="det">${d||""}</span></div>`;
const CS="var(--serie-saida)";
const CAT_SERIES=CATS.map(c=>({k:c.k,c:CAT_COL[c.k],l:c.lab}));

}

function diagnostico(){
  const C=S.C,BL=C.BL,P=S.params,F=[];
  const push=(sev,t,d)=>F.push({sev,t,d});
  const ent3=CAT_KEYS.reduce((s,k)=>s+C.entMed[k],0);
  if(C.saiMed<ent3)push("bad",`O backlog cresce cerca de ${nf(ent3-C.saiMed)} tickets por mês`,`Entram ${nf(ent3)} e saem ${nf(C.saiMed)} por mês (${C.fechados.map(mlab).join(", ")}).`);
  else push("ok",`Na média dos últimos 3 meses o fluxo está equilibrado`,`Saem ${nf(C.saiMed)} e entram ${nf(ent3)} tickets por mês (${C.fechados.map(mlab).join(", ")}).`);
  const lm=C.fluxo.filter(x=>x.m<curMonth).slice(-1)[0];if(lm){const e=CAT_KEYS.reduce((s,k)=>s+lm[k],0);push(lm.sai<e?"bad":"ok",`Em ${mlab(lm.m)} entraram ${nf(e)} e saíram ${nf(lm.sai)} tickets`,lm.sai<e?`O backlog cresceu ${nf(e-lm.sai)} tickets no último mês fechado.`:`O backlog diminuiu ${nf(lm.sai-e)} tickets no último mês fechado.`);}
  const sp=C.sop.total,sr=C.sop.ativo;
  push(sp.zerou==null?"bad":"ok",`Backlog total (${nf(sp.nBL)} tickets): ${sp.zerou!=null?`zera em ${nf(sp.zerou+1)} meses`:`não zera em ${SAFETY_MESES} meses`}`,`Pagando até 90% da capacidade do mês ao backlog (${sp.fteAtual} pessoas, ${nf(sp.capFTE,1)} h/mês cada)${sp.zerou==null?`; faltariam ~${nf(sp.extraFTE,1)} pessoa(s) a mais para zerar em ${SAFETY_MESES} meses`:""}.`);
  push(sr.zerou==null?"bad":"ok",`Backlog ativo (${nf(sr.nBL)} tickets, sem os ${nf(sr.nFora)} que dependem do cliente ou de terceiros): ${sr.zerou!=null?`zera em ${nf(sr.zerou+1)} meses`:`não zera em ${SAFETY_MESES} meses`}`,sr.zerou==null?`Faltariam ~${nf(sr.extraFTE,1)} pessoa(s) a mais.`:"");
  const donos={};BL.forEach(t=>donos[t.dono]=(donos[t.dono]||0)+1);const top=Object.entries(donos).filter(x=>x[0]!=="Sem responsável ativo").sort((a,b)=>b[1]-a[1]);
  if(top.length){const s2=(top[0][1]+(top[1]?top[1][1]:0))/BL.length;push(s2>0.6?"warn":"ok",`${top[0][0]}${top[1]?" e "+top[1][0]:""} concentram ${pct(s2)} do backlog`,top.map(([n,v])=>`${n}: ${v}`).join(" · "));}
  const semDono=BL.filter(t=>t.dono==="Sem responsável ativo");if(semDono.length)push("warn",`${semDono.length} tickets no backlog sem responsável ativo`,`Sem agente, com agente desativado ou fora do time (ex.: Andrei, Livia). Redistribuir.`);
  const ag=BL.filter(t=>/aguardando cliente|validacao do cliente/.test(norm(t.st)));const ag90=ag.filter(t=>t.idade>90);
  push(ag.length/BL.length>0.4?"warn":"ok",`${pct(ag.length/BL.length)} do backlog depende do cliente (${ag.length} tickets)`,`${ag90.length} deles têm mais de 90 dias.`);
  const par=BL.filter(t=>t.parado>30);push(par.length/BL.length>0.3?"warn":"ok",`${par.length} tickets sem movimentação há mais de 30 dias`,`${pct(par.length/BL.length)} do backlog.`);
  const ambig=C.T.filter(t=>t.regra==="Padrão");push(ambig.length>20?"warn":"ok",`${ambig.length} tickets com classificação ambígua (regra "Padrão")`,`Sem Subtipo nem Tags que indiquem a categoria — hoje tratados como ${CAT_LAB["migr_nmapeado"]} ou ${CAT_LAB["orcamento"]} por padrão. Revisar o Subtipo no Freshdesk melhora o S&OP.`);
  const interno=C.T.filter(t=>t.cat==="interno");if(interno.length)push("info",`${interno.length} tickets de Atividades Internas`,`Ficam fora do SLA e da demanda do S&OP, contam só como volume.`);
  if(S.H){const last=C.months[C.months.length-1];if(last===curMonth){const h=Object.values(C.teamH[last]||{}).reduce((s,x)=>s+x,0);const c=Object.values(C.capM[last]||{}).reduce((s,x)=>s+x,0);if(c&&h<0.3*c)push("warn",`Apontamento de ${mlab(last)} atrasado: ${nf(h)} h de ${nf(c)} h de capacidade`,`O S&OP e a ocupação usam os meses completos (${C.ref.map(mlab).join(", ")}).`);}
    const semTk=C.A.filter(a=>C.team.has(a.analyst_name)&&!String(a.ticket_id||"").trim()).reduce((s,a)=>s+(a.horas||0),0);const totT=C.A.filter(a=>C.team.has(a.analyst_name)).reduce((s,a)=>s+(a.horas||0),0);
    push("info",`${pct(semTk/totT)} das horas do time não estão ligadas a um ticket`,`${nf(semTk)} h de ${nf(totT)} h (atividades internas, reuniões, apoio).`);
    push("info","Horas apontadas começam em "+(C.months[0]?mlab(C.months[0]):"–"),"Antes disso não há registro no Painel de Serviços.");
  }
  push("info","Fechamentos antigos arquivados pelo Freshdesk","Tickets Closed antigos somem da API; a extração incremental preserva o histórico a partir de quando passou a rodar.");

const SA_DEF={horizonte:6,recupera:3,teto:1,limite:0.85,ded:{},ferias:{},novos:[],rampa:[0.3,0.6,0.9,1]};
function saCfg(){const s=(S.params&&S.params.sop_analista)||{};
  return {...SA_DEF,...s,ded:{...(s.ded||{})},ferias:JSON.parse(JSON.stringify(s.ferias||{})),novos:(s.novos||[]).filter(x=>x&&String(x.nome||"").trim()),rampa:(Array.isArray(s.rampa)&&s.rampa.length===4)?s.rampa.map(Number):SA_DEF.rampa.slice()};}

function saStatus(oc,cap,al,Q){if(!cap)return al>0.5?"sem":"nd";const o=Math.round(oc*100),t=Math.round(Q.teto*100),l=Math.round(Q.limite*100);return o>t?"acima":o>=l?"limite":"folga";}

function diasUteis(a,b){let n=0;for(let d=Math.floor(a/864e5);d*864e5<b;d++){const w=new Date(d*864e5).getUTCDay();if(w>0&&w<6)n++;}return n;}

const mDiff=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const SA_SEM="_sem";
function sopAnalista(cen,modo,o){o=o||{};
  const C=S.C,P=S.params,Q=saCfg(),H=o.H||Math.max(1,Math.min(12,Math.round(+Q.horizonte||6))),R=Math.max(1,+Q.recupera||3),fp=+P.fator_produtivo||0.85;
  const now=Date.now();let m0=curMonth,t0=now;const parcial0=(mIni(addMonths(curMonth,1))-now)/864e5;
  if(o.m0){m0=o.m0;t0=mIni(m0);}else if(parcial0<7){m0=addMonths(curMonth,1);t0=mIni(m0);}
  const meses=[];for(let k=0;k<H;k++)meses.push(addMonths(m0,k));
  const ini=meses.map((m,i)=>i===0?t0:mIni(m)),fim=meses.map(m=>mIni(addMonths(m,1)));
  const du=meses.map((m,i)=>diasUteis(mIni(m),fim[i]));
  const frac=meses.map((m,i)=>du[i]?diasUteis(ini[i],fim[i])/du[i]:0);
  const team=[...C.team];
  const pessoas=[...team.map(n=>({id:n,nome:short(n),novo:false,ded:Q.ded[n]!=null?+Q.ded[n]:1})),
    ...Q.novos.map((n,j)=>({id:"novo:"+j,nome:String(n.nome).trim(),novo:true,mes:n.mes||addMonths(m0,2),ded:n.ded!=null?+n.ded:1}))];
  const rampa=(p,i)=>{if(!p.novo)return 1;const k=mDiff(p.mes,meses[i]);return k<0?0:Q.rampa[Math.min(3,k)];};
  const cap={};for(const p of pessoas)cap[p.id]=meses.map((m,i)=>{const base=p.novo?P.horas_mes_padrao:(((C.capM[m]||{})[p.id])||P.horas_mes_padrao);
    const fer=p.novo?0:+(((Q.ferias[p.id]||{})[m])||0);return base*fp*p.ded*Math.max(0,1-fer/Math.max(1,du[i]))*rampa(p,i)*frac[i];});
  const ids=[...pessoas.map(p=>p.id),SA_SEM];const z=()=>meses.map(()=>0);
  const fila={},nFila={},fc={},nFc={};for(const id of ids){fila[id]=z();nFila[id]=z();fc[id]=z();nFc[id]=z();}
  const own=t=>C.team.has(t.donoFull)?t.donoFull:SA_SEM;
  const BL=o.BL||(cen==="ativo"?C.BL.filter(t=>t.ativo&&t.cat!=="interno"):C.BL.filter(t=>t.cat!=="interno"));const sal=o.saldo||(t=>t.saldo||0);const tR=t0+R*30.44*864e5;let apos=0,totSaldo=0,semSq=0;

    sn.cat[t.cat]=sn.cat[t.cat]||{n:0,h:0};sn.cat[t.cat].n++;sn.cat[t.cat].h+=s;
    let b;if(t.limite!=null&&t.limite>t0)b=Math.max(t.limite,t0+7*864e5);else b=tR;const L=b-t0;let dentro=0;
    for(let i=0;i<H;i++){const x=Math.max(0,Math.min(b,fim[i])-Math.max(t0,ini[i]));if(x>0){const h=s*x/L;fila[o][i]+=h;dentro+=h;nFila[o][i]++;if(o===SA_SEM&&i<Math.min(R,H))semSq+=h;}}

  if(modo==="hist"){const M=C.fechados;
    for(const r of F.rows){const L=C.T.filter(t=>t.novo_no_ano&&M.includes(t.mesEnt)&&t.cat===r.k);if(!L.length){for(let i=0;i<H;i++){fc[SA_SEM][i]+=r.h*frac[i];nFc[SA_SEM][i]+=r.fc*frac[i];}continue;}
      const cnt={};for(const t of L){const o=own(t);cnt[o]=(cnt[o]||0)+1;}
      for(const o in cnt){const sh=cnt[o]/L.length;for(let i=0;i<H;i++){fc[o][i]+=r.h*sh*frac[i];nFc[o][i]+=r.fc*sh*frac[i];}}}}
  else{for(const r of F.rows){const mem=pessoas;
    for(let i=0;i<H;i++){const w=mem.map(p=>p.novo?rampa(p,i):1),W=w.reduce((a,b)=>a+b,0);
      if(!W){fc[SA_SEM][i]+=r.h*frac[i];nFc[SA_SEM][i]+=r.fc*frac[i];continue;}
      mem.forEach((p,j)=>{fc[p.id][i]+=r.h*frac[i]*w[j]/W;nFc[p.id][i]+=r.fc*frac[i]*w[j]/W;});}}}
  const mk=(p)=>{const c=p.sem?z():cap[p.id],al=meses.map((_,i)=>fila[p.id][i]+fc[p.id][i]);const oc=meses.map((_,i)=>c[i]?al[i]/c[i]:null);

    return {...p,cap:c,fila:fila[p.id],fc:fc[p.id],al,oc,st:meses.map((_,i)=>saStatus(oc[i],c[i],al[i],Q)),nTk:meses.map((_,i)=>nFila[p.id][i]+nFc[p.id][i]),
      saldo:meses.map((_,i)=>c[i]-al[i]),ocMed:sc?sa/sc:null,snap:snap[p.id],fcMes:fc[p.id].reduce((a,b)=>a+b,0)/Math.max(1e-9,frac.reduce((a,b)=>a+b,0))};};
  const rows=[...pessoas.map(mk),mk({id:SA_SEM,nome:"Sem responsável ativo",sem:true})];
  const P_=rows.filter(r=>!r.sem),sem=rows.find(r=>r.sem);
  const sum=k=>meses.map((_,i)=>P_.reduce((a,r)=>a+r[k][i],0));

const PLANO_DEF={dias_inatividade:30,meta_sla:0.8,contratar_pessoas:null,contratar_mes:3};
function plano(cenArg){
  const C=S.C,P=S.params,Q={...PLANO_DEF,...(P.plano||{})};
  const cen=cenArg||cenKey();const sp=C.sop[cen];const capFTE=sp.capFTE;
  const deficitMes=sp.zerou==null?sp.extraFTE*capFTE:0;
  const esperaRe=/aguardando cliente|validacao do cliente/;
  const espera=C.BL.filter(t=>esperaRe.test(norm(t.st))&&t.parado>Q.dias_inatividade);
  const esperaH=espera.reduce((s,t)=>s+Math.max(0,t.esf-t.horas),0);
  const H=SAFETY_MESES;
  const ganho=cen==="ativo"?0:esperaH/H;
  const cobre=deficitMes?Math.min(1,ganho/deficitMes):null;
  const resid=Math.max(0,deficitMes-ganho);const contratar=resid>0?Math.ceil(resid/capFTE*10)/10:0;
  return {Q,cen,sp,deficitMes,espera,esperaH,ganho,cobre,resid,contratar,capFTE};
}
const PRAZO_MES={"2 semanas":0};
function simFila(ganhos,pessoas,mesPessoas,capFTE,F,opts){
  const C=S.C,SC=C.slaCfg,WPM=4.345,W=Math.round(18*WPM),t0=Date.now(),cap0=C.sop.total.capMedio;
  let items=C.BL.filter(t=>t.ativo&&t.cat!=="interno"&&t.limite!=null).map(t=>({lim:t.limite,rem:Math.max(t.saldo,0.25),cat:t.cat}));
  const acc={},mon=[];
  for(let w=0;w<W;w++){const m=Math.floor(w/WPM),ws=t0+w*7*864e5;
    for(const r of F.rows){acc[r.k]=(acc[r.k]||0)+r.fc/WPM;while(acc[r.k]>=1){acc[r.k]-=1;items.push({lim:ws+3.5*864e5+SC.dias[r.k]*864e5,rem:r.esf,cat:r.k});}}
    const capM=cap0+ganhos.reduce((a,g)=>a+(m>=g.mes?g.h:0),0)+(m>=mesPessoas?pessoas*capFTE:0);
    const cap=capM/WPM;let left=cap;items.sort((a,b)=>a.lim-b.lim);const mm=mon[m]=mon[m]||{ok:0,late:0,cap:capM};
    for(const it of items){if(left<=1e-9)break;const tk=Math.min(it.rem,left);it.rem-=tk;left-=tk;if(it.rem<=1e-9){it.done=1;if(ws+((cap-left)/cap)*7*864e5<=it.lim)mm.ok++;else mm.late++;}}
    for(let i=items.length-1;i>=0;i--)if(items[i].done)items.splice(i,1);
    mm.used=(mm.used||0)+(cap-left);mm.capW=(mm.capW||0)+cap;
    const fim=ws+7*864e5;mm.bl=items.length;mm.venc=items.filter(i=>i.lim<fim).length;}
  const meses=mon.map((x,i)=>({i,m:new Date(t0+(i+0.5)*30.44*864e5).toISOString().slice(0,7),ent:x.ok+x.late,p:(x.ok+x.late)?x.ok/(x.ok+x.late):null,bl:x.bl,venc:x.venc,cap:x.cap,ocup:x.capW?x.used/x.capW:null}));
  return meses;}
function estabiliza(meses,meta){let k=null;for(let i=meses.length-1;i>=0;i--){if(meses[i].p!=null&&meses[i].p>=meta)k=i;else break;}

    <tr><td>Sem mudanças</td><td><span class="chip ${eBase.mes==null?"bad":"ok"}">${esc(lbl(eBase))}</span></td></tr>
    <tr><td>Só encerrar a fila parada</td><td><span class="chip ${eAc.mes==null?"bad":eAc.mes<=6?"ok":"warn"}">${esc(lbl(eAc))}</span></td></tr>
    <tr><td>Menor contratação que estabiliza em até 6 meses</td><td>${min?`<span class="chip ok">${min.p} pessoa(s) · ${esc(lbl(min.e))}</span>`:`<span class="chip bad">nenhuma até 6 pessoas</span>`}</td></tr>
   </tbody></table></div>
  </div>`;}
function vAcao(){
  const C=S.C,X=plano("total"),P=S.params;if(!S.H)return `<section class="view"><p class="note">O Plano de Ação precisa da base de horas. Carregue-a em Configuração.</p></section>`;
  const reab=C.T.filter(t=>t.reaberto_em).length;const fr1=median(C.T.filter(t=>t.novo_no_ano&&t.primeira_resposta_h!==""&&t.primeira_resposta_h!=null).map(t=>+t.primeira_resposta_h));
  const ambig=C.T.filter(t=>t.regra==="Padrão").length;
  return `<section class="view">
   ${resumoAndamento()}
   <h2 style="font-size:18px;line-height:24px;font-weight:600;margin:8px 0 0">Backlog Geral <span class="chip" style="vertical-align:middle">${nf(C.BL.filter(t=>t.cat!=="interno").length)} tickets · todos os status em aberto</span></h2>
   <div class="verdict ${X.deficitMes>0?(X.contratar>0?"bad":"warn"):"good"}">
    <span style="font-size:12px;font-weight:500">Backlog Geral · capacidade × demanda</span>
    <span class="big">${X.deficitMes<=0?`A capacidade já cobre a demanda no cenário ${CEN[X.cen]}; o foco é ganhar folga e reduzir a fila parada.`:
      X.contratar>0?`Encerrar a fila parada cobre ${pct(X.cobre||0)} do déficit de ${nf(X.deficitMes)} h/mês; o restante pede ~${nf(X.contratar,1)} pessoa(s).`:
      `Encerrar a fila parada cobre o déficit de ${nf(X.deficitMes)} h/mês sem contratar.`}</span>
    <span style="font-size:13px">Backlog Geral (${nf(C.BL.filter(t=>t.cat!=="interno").length)} tickets, inclusive suspensos e aguardando o cliente) · capacidade de ${nf(X.capFTE)} h/mês por pessoa. Premissas editáveis no fim desta aba.</span></div>
   ${cardEstab(X)}
   <div class="card"><h2>Outras análises</h2>
    <div class="find"><span class="chip warn">Fila</span><div><b>${nf(X.espera.length)} tickets aguardam o cliente há mais de ${X.Q.dias_inatividade} dias</b><p>Não consomem horas hoje, mas ocupam a fila e distorcem a idade do backlog e o S&amp;OP. Encerramento por inatividade com reabertura automática resolve sem custo.</p></div></div>
    <div class="find"><span class="chip info">Resposta</span><div><b>1ª resposta mediana de ${nf(fr1)} h nos tickets do ano</b><p>Uma triagem com resposta automática e checklist de pré-requisitos por categoria reduz idas e vindas com o cliente.</p></div></div>
    <div class="find"><span class="chip info">Retrabalho</span><div><b>${nf(reab)} tickets foram reabertos</b><p>Checklist de encerramento e validação com o cliente antes de fechar reduzem retorno à fila.</p></div></div>
    <div class="find"><span class="chip y">Classificação</span><div><b>${nf(ambig)} tickets com classificação ambígua (regra "Padrão")</b><p>Sem Subtipo nem Tags que indiquem a categoria. Tornar o Subtipo e as tags "sistema mapeado/não mapeado" e "com/sem anexos" obrigatórios na abertura melhora o S&amp;OP.</p></div></div>
   </div>
   <div class="card"><h2>Premissas das ações</h2><p class="hint">Ajuste para simular cenários${S.canEdit?"":" (somente leitura)"}</p>
    <div class="filters">
     <label class="f" for="a_hc">Pessoas a contratar (simulação)<input type="number" id="a_hc" min="0" max="10" step="1" value="${X.Q.contratar_pessoas!=null?X.Q.contratar_pessoas:Math.max(1,Math.ceil(X.contratar||1))}" ${S.canEdit?"":"disabled"}></label>
     <label class="f" for="a_hm">Contratação entra no mês<input type="number" id="a_hm" min="1" max="12" step="1" value="${(+X.Q.contratar_mes||3)+1}" ${S.canEdit?"":"disabled"}></label>
     <label class="f" for="a_mt">Meta de entregas no prazo (%)<input type="number" id="a_mt" min="50" max="100" step="5" value="${Math.round((+X.Q.meta_sla||0.8)*100)}" ${S.canEdit?"":"disabled"}></label>
     <label class="f" for="a_di">Dias aguardando cliente para encerrar<input type="number" id="a_di" min="7" max="180" step="1" value="${X.Q.dias_inatividade}" ${S.canEdit?"":"disabled"}></label>
     ${S.canEdit?`<button class="btn pri" id="a_save">Salvar premissas</button>`:""}
    </div></div>
  </section>`;
}
async function saveAcao(){if(!S.db)return;const g=id=>+document.getElementById(id).value;
  const p={...S.params,plano:{dias_inatividade:g("a_di"),contratar_pessoas:Math.max(0,g("a_hc")),contratar_mes:Math.max(0,g("a_hm")-1),meta_sla:Math.min(1,Math.max(0.5,g("a_mt")/100))},atualizado_em:new Date().toISOString()};
  try{await S.db.doc("cfg/params").set(p);toast("Premissas salvas");}catch(e){toast("Não foi possível salvar.");}}

function vCfg(){
  const P=S.params,ro=!S.canEdit,dis=ro?"disabled":"";const b=S.bases||{};
  const pessoas=[...new Set([...(S.T||[]).map(t=>t.agente).filter(Boolean),...((S.H&&S.H["Analistas"])||[]).map(a=>a.name).filter(Boolean)])].filter(n=>!/Agente Padr/.test(n)).sort();
  const st=(k,lab)=>{const x=b[k];return x?`<span class="chip ok">${lab}: ${esc((x.gerado_em||"").replace("T"," ").slice(0,16))} · ${nf(x.linhas)} linhas</span>`:`<span class="chip warn">${lab}: não carregada</span>`;};
  return `<section class="view">
   ${ro?`<p class="note">Somente leitura. Parâmetros, time e cargas são mantidos por quem pode editar o painel.</p>`:""}
   <div class="grid g2">
    <div class="card"><h2>Parâmetros do S&amp;OP</h2>
     <div class="filters">
      <label class="f" for="p_fp">Tempo produtivo (%)<input type="number" id="p_fp" step="5" min="10" max="100" value="${Math.round(P.fator_produtivo*100)}" ${dis}></label>
      <label class="f" for="p_hp">Horas/mês sem capacidade no Painel<input type="number" id="p_hp" step="1" min="40" max="220" value="${P.horas_mes_padrao}" ${dis}></label>
      <label class="f" for="p_cen">Cenário do diagnóstico<select id="p_cen" ${dis}><option value="total" ${cenKey()==="total"?"selected":""}>Backlog total</option><option value="ativo" ${cenKey()==="ativo"?"selected":""}>Backlog ativo</option></select></label>
     </div>
     <h2 style="margin-top:8px">Esforço padrão por categoria (h)</h2><p class="hint">Migração tem dois valores: sem anexo e com anexo (tag do Freshdesk decide qual usar em cada ticket)</p>
     <div class="filters">${CATS.map((c,i)=>{const e=esforcoPadrao(c.k);return c.esf!=null?`<label class="f" for="pe_${i}">${esc(c.lab)}<input type="number" id="pe_${i}" data-k="${c.k}" step="0.5" min="0" value="${e.sem}" ${dis}></label>`:
       `<label class="f" for="pe_${i}s">${esc(c.lab)} · sem anexo<input type="number" id="pe_${i}s" data-k="${c.k}" data-sub="sem" step="0.5" min="0" value="${e.sem}" ${dis}></label><label class="f" for="pe_${i}c">${esc(c.lab)} · com anexo<input type="number" id="pe_${i}c" data-k="${c.k}" data-sub="com" step="0.5" min="0" value="${e.com}" ${dis}></label>`;}).join("")}</div>
     <h2 style="margin-top:8px">SLA por categoria (dias corridos)</h2>
     <div class="filters">${CAT_KEYS.map((k,i)=>`<label class="f" for="sl_${i}">${esc(CAT_LAB[k])}<input type="number" id="sl_${i}" data-k="${k}" step="1" min="1" max="180" value="${slaCfg().dias[k]}" ${dis}></label>`).join("")}
      <label class="f" for="sl_px">"Próximo" nos últimos (%)<input type="number" id="sl_px" step="5" min="5" max="75" value="${Math.round(slaCfg().proximo*100)}" ${dis}></label></div>
     <h2 style="margin-top:8px">Time</h2><p class="hint">Time único: quem entra na capacidade e na fila atende todas as categorias. Quem sai do time tem os tickets contados como "Sem responsável ativo".</p>
     <div style="display:flex;flex-wrap:wrap;gap:8px 16px">${pessoas.map((n,i)=>`<label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="tm_${i}" data-n="${esc(n)}" ${(P.time||[]).includes(n)?"checked":""} ${dis}>${esc(short(n))}</label>`).join("")}</div>
     ${ro?"":`<div><button class="btn pri" id="p_save">Salvar parâmetros</button></div>`}
    </div>
    <div class="card"><h2>Bases de dados</h2><div class="chips">${st("tickets","Tickets")} ${st("horas","Horas")}</div>
     <p class="hint" style="margin:0">As bases são geradas no computador do Diego (extração agendada seg-sex às 20h) e carregadas aqui. Arquivos: <span class="mono">base_servicos_adv.json</span> e <span class="mono">horas_apontadas_&lt;ano&gt;_painel.json</span> (mesma base do time Técnico — o painel filtra pelos 4 analistas do time).</p>
     ${S.assets?`<label class="f" for="up_file">Carregar arquivo de base (JSON)<input type="file" id="up_file" accept=".json,application/json"></label>`:`<p class="note">A carga de arquivos está disponível só para quem pode editar o painel.</p>`}
     <h2 style="margin-top:8px">Regras de classificação</h2><ul class="rules">
      <li><b>Migração</b> (Sistemas Mapeados / Não Mapeados) quando o Subtipo diz isso; "com/sem anexos" vem das tags.</li>
      <li><b>Ações em Lote / Scripts</b>, <b>Importação de Dados</b>, <b>Importação de Documentos</b> pelo Subtipo.</li>
      <li><b>Viabilidade/Orçamento</b> quando não há Subtipo e o Tipo fala de orçamento ou dúvidas (inclui as antigas "Dúvidas").</li>
      <li>"Ajustes de inconsistências" e "Migração" genérica (sem mapeado/não mapeado no Subtipo) usam as Tags e, por último, o Assunto; sem nenhuma pista, viram Migração · Não Mapeados e ficam marcados como "Padrão" (ambíguo) no Backlog.</li>
      <li>Saídas = tickets resolvidos ou fechados no mês. Backlog = status diferente de Resolved e Closed. Atividades Internas ficam fora do SLA e da demanda.</li></ul>
    </div>
   </div></section>`;
}

// ---------------- render / eventos ----------------
function drawTabs(){$("#tabs").innerHTML=TABS.map(([v,l])=>`<button role="tab" data-v="${v}" aria-selected="${S.view===v}">${esc(l)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;try{localStorage.setItem("sa_view",S.view);}catch(e){}render();});}
function drawFresh(){const b=S.bases||{},el=$("#fresh");if(!b.tickets&&!b.horas){el.innerHTML=`<span class="chip warn">Bases não carregadas</span>`;return;}
  const age=x=>x&&x.gerado_em?Math.floor((Date.now()-new Date(x.gerado_em))/36e5):null;
  const c=(x,l)=>{if(!x)return `<span class="chip warn">${l}: sem carga</span>`;const h=age(x);return `<span class="chip ${h>30?"warn":"ok"}">${l}: ${esc((x.gerado_em||"").slice(8,10)+"/"+(x.gerado_em||"").slice(5,7)+" "+(x.gerado_em||"").slice(11,16))} UTC</span>`;};
  el.innerHTML=c(b.tickets,"Tickets")+c(b.horas,"Horas")+(S.C?`<span class="chip">Time: ${[...S.C.team].map(short).join(", ")}</span>`:"");}
function drawUpd(){const el=$("#upd");if(!el)return;el.innerHTML=`<span class="chip">Carga manual em Configuração</span>`;}
function render(){drawTabs();drawFresh();drawUpd();const m=$("#main");
  if(S.loadErr){m.innerHTML=`<section class="view"><p class="note">${esc(S.loadErr)}</p></section>`+(S.view==="cfg"?vCfg():"");bind();return;}
  if(!S.db&&S.ready){m.innerHTML=`<section class="view"><p class="note">Este painel lê as bases do banco do artefato. Abra-o no Claude, com sua conta da organização.</p></section>`;return;}
  if(!S.C){m.innerHTML=S.ready?`<section class="view"><p class="note">Nenhuma base carregada ainda. Em Configuração, carregue <span class="mono">base_servicos_adv.json</span> e <span class="mono">horas_apontadas_&lt;ano&gt;_painel.json</span>.</p></section>`+(S.view==="cfg"?vCfg():""):`<section class="view"><p class="note">Carregando dados…</p></section>`;bind();return;}
  m.innerHTML=({geral:vGeral,diag:vDiag,sla:vSla,backlog:vBacklog,time:vTime,horas:vHoras,sop:vSop,sopa:vSopa,acao:vAcao,cfg:vCfg}[S.view]||vGeral)();bind();}
function bind(){
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e[ev]=fn;};
  ["cat","sla","dono","status"].forEach(k=>on("f_"+k,"onchange",e=>{S.blFilter[k]=e.target.value;S.blFilter.limite=200;render();}));
  on("f_q","oninput",e=>{clearTimeout(bind._q);const v=e.target.value;bind._q=setTimeout(()=>{S.blFilter.q=v;render();const n=$("#f_q");if(n){n.focus();n.setSelectionRange(v.length,v.length);}},300);});
  on("f_more","onclick",()=>{S.blFilter.limite+=300;render();});
  on("f_csv","onclick",exportCsv);
  on("p_save","onclick",saveParams);
  on("a_save","onclick",saveAcao);
  on("sa_save","onclick",saveSa);
  on("sa_csv","onclick",exportSa);
  document.querySelectorAll("[data-sa-k]").forEach(b=>b.onclick=()=>{S.sa[b.dataset.saK]=b.dataset.saV;try{localStorage.setItem("sa_sa",JSON.stringify(S.sa));}catch(e){}render();});
  on("up_file","onchange",e=>upload(e.target.files[0]));
}
async function exportCsv(){const dl=await window.claude?.use?.("downloads");if(!dl){toast("Download indisponível nesta visualização.");return;}
  const L=blFiltered();const head=["Ticket","Assunto","Categoria","Regra","Status","Responsável","Subtipo","Anexo","Situação do SLA","Data limite","Dias de atraso","Idade (dias)","Parado (dias)","Horas apontadas","Saldo (h)"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv="﻿"+[head.join(";")].concat(L.map(t=>[t.id,t.assunto,CAT_LAB[t.cat],t.regra,t.st,t.dono,t.subtipo,t.anexo==null?"":(t.anexo?"Com anexo":"Sem anexo"),SLA_LAB[t.sla]||"",t.limite?new Date(t.limite).toISOString().slice(0,10):"",Math.round(t.atraso),t.idade,t.parado,String(t.horas.toFixed(2)).replace(".",","),String(t.saldo.toFixed(2)).replace(".",",")].map(q).join(";"))).join("\r\n");
  try{await dl.save({filename:"backlog_servicos_adv.csv",data:new Blob([csv],{type:"text/csv"})});}catch(e){toast("Download não concluído.");}}
async function saveParams(){if(!S.db)return;const g=id=>+document.getElementById(id).value;
  const time=[...document.querySelectorAll("input[id^=tm_]")].filter(i=>i.checked).map(i=>i.dataset.n);
  const esforco={};document.querySelectorAll("input[data-k][data-sub]").forEach(e=>{esforco[e.dataset.k]=esforco[e.dataset.k]||{};esforco[e.dataset.k][e.dataset.sub]=+e.value||0;});
  document.querySelectorAll("input[id^=pe_]:not([data-sub])").forEach(e=>{if(e.dataset.k)esforco[e.dataset.k]={sem:+e.value||0,com:+e.value||0};});
  const p={...S.params,esforco:{...S.params.esforco,...esforco},fator_produtivo:g("p_fp")/100,horas_mes_padrao:g("p_hp"),cenario:document.getElementById("p_cen").value,time,atualizado_em:new Date().toISOString()};
  const dias={};document.querySelectorAll("input[id^=sl_]").forEach(e=>{if(e.dataset.k)dias[e.dataset.k]=Math.max(1,+e.value||SLA_DIAS_DEF[e.dataset.k]);});
  const px=document.getElementById("sl_px");p.sla={dias,proximo:px?Math.min(0.75,Math.max(0.05,(+px.value||25)/100)):0.25};
  if(!time.length){toast("Selecione ao menos uma pessoa no time.");return;}
  try{await S.db.doc("cfg/params").set(p);toast("Parâmetros salvos");}catch(e){toast(e&&e.code==="invalid_argument"?"Você não tem permissão para alterar os parâmetros.":"Não foi possível salvar. Tente de novo.");}}
async function upload(file){if(!file||!S.assets||!S.db)return;
  let j;try{j=JSON.parse(await file.text());}catch(e){toast("O arquivo não é um JSON válido.");return;}
  const kind=j.tabelas&&j.tabelas["Apontamentos"]?"horas":(j.colunas&&j.linhas?"tickets":null);
  if(!kind){toast("Arquivo não reconhecido. Use base_servicos_adv.json ou horas_apontadas_<ano>_painel.json.");return;}
  toast("Enviando "+(kind==="horas"?"base de horas":"base de tickets")+"…");
  try{const r=await S.assets.upload(file,{type:"application/json"});const old=(S.bases||{})[kind];
    const meta=j.meta||{};const linhas=kind==="horas"?(j.tabelas["Apontamentos"].linhas||[]).length:j.linhas.length;
    const doc={...(S.bases||{}),[kind]:{asset:r.id,gerado_em:meta.gerado_em||"",linhas,enviado_em:new Date().toISOString(),arquivo:file.name}};
    await S.db.doc("cfg/bases").set(doc);
    if(old&&old.asset&&old.asset!==r.id){try{await S.assets.delete(old.asset);}catch(e){}}
    toast("Base carregada");}
  catch(e){toast({too_large:"Arquivo acima de 20 MB.",rate_limited:"Muitas tentativas; aguarde um pouco.",not_granted:"Sem permissão para carregar arquivos."}[e&&e.code]||"Não foi possível carregar o arquivo.");}}

// ---------------- boot ----------------
try{const a=JSON.parse(localStorage.getItem("sa_sa")||"null");if(a&&typeof a==="object")S.sa={cen:a.cen==="ativo"?"ativo":"total",modo:a.modo==="hist"?"hist":"squad",atual:a.atual==="real"?"real":"prev"};}catch(e){}
try{const v=localStorage.getItem("sa_view");if(v&&TABS.some(t=>t[0]===v))S.view=v;}catch(e){}
if(/^#[a-z]+$/.test(location.hash)&&TABS.some(t=>"#"+t[0]===location.hash))S.view=location.hash.slice(1);
render();
(async function boot(){const c=window.claude;
  const [db,user]=await Promise.all([c?.use?.("db")??null,c?.use?.("user")??null]);
  S.db=db;S.user=user;S.ready=true;
  if(user){try{S.canEdit=await user.canEdit();}catch(e){}}
  if(S.canEdit){c?.use?.("assets").then(a=>{S.assets=a;if(S.view==="cfg")render();}).catch(()=>{});}
  if(!db){render();return;}
  db.doc("cfg/params").onSnapshot(s=>{S.params=s.exists?{...JSON.parse(JSON.stringify(DEFAULT_PARAMS)),...s.data()}:JSON.parse(JSON.stringify(DEFAULT_PARAMS));if(S.T){compute();}render();},()=>{});
  db.doc("cfg/bases").onSnapshot(s=>{S.bases=s.exists?s.data():null;loadBases();},()=>{S.loadErr="Não foi possível ler o banco do painel.";render();});
})();
})();
</script>
