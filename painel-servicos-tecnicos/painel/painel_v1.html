<style>
/* Layout: barra de abas fixa + visão ativa em grade de cartões; tokens do design system Projuris (tema Empresas) */
:root{
  --background:#FFFFFF;--foreground:#030712;--card:#FFFFFF;--card-foreground:#09090B;
  --muted:#F4F4F5;--muted-foreground:#64748B;--border:#E5E7EB;--accent:#F4F4F5;
  --primary:#2563EB;--primary-foreground:#FAFAFA;--ring:#D1D5DB;
  --destructive:#B91C1C;--success:#15803D;--warning:#C2410C;
  --tag-gray:#F4F4F5;--tag-gray-fg:#4B5563;--tag-blue:#DBEAFE;--tag-blue-fg:#1D4ED8;
  --tag-green:#DCFCE7;--tag-green-fg:#15803D;--tag-orange:#FFEDD5;--tag-orange-fg:#C2410C;
  --tag-red:#FEE2E2;--tag-red-fg:#B91C1C;--tag-yellow:#FEF9C3;--tag-yellow-fg:#A16207;
  --serie-dados:#2563EB;--serie-ativ:#94A3B8;--serie-saida:#0369A1;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --background:#09090B;--foreground:#FAFAFA;--card:#18181B;--card-foreground:#FAFAFA;
  --muted:#27272A;--muted-foreground:#9CA3AF;--border:rgba(255,255,255,.10);--accent:#27272A;
  --primary:#3B82F6;--primary-foreground:#FAFAFA;--ring:#3F3F46;
  --destructive:#EF4444;--success:#22C55E;--warning:#FB923C;
  --tag-gray:#27272A;--tag-gray-fg:#9CA3AF;--tag-blue:#172554;--tag-blue-fg:#93C5FD;
  --tag-green:#052E16;--tag-green-fg:#86EFAC;--tag-orange:#431407;--tag-orange-fg:#FDBA74;
  --tag-red:#450A0A;--tag-red-fg:#FCA5A5;--tag-yellow:#422006;--tag-yellow-fg:#FDE047;
  --serie-dados:#3B82F6;--serie-ativ:#64748B;--serie-saida:#7DD3FC;color-scheme:dark}}
:root[data-theme="dark"]{
  --background:#09090B;--foreground:#FAFAFA;--card:#18181B;--card-foreground:#FAFAFA;
  --muted:#27272A;--muted-foreground:#9CA3AF;--border:rgba(255,255,255,.10);--accent:#27272A;
  --primary:#3B82F6;--primary-foreground:#FAFAFA;--ring:#3F3F46;
  --destructive:#EF4444;--success:#22C55E;--warning:#FB923C;
  --tag-gray:#27272A;--tag-gray-fg:#9CA3AF;--tag-blue:#172554;--tag-blue-fg:#93C5FD;
  --tag-green:#052E16;--tag-green-fg:#86EFAC;--tag-orange:#431407;--tag-orange-fg:#FDBA74;
  --tag-red:#450A0A;--tag-red-fg:#FCA5A5;--tag-yellow:#422006;--tag-yellow-fg:#FDE047;
  --serie-dados:#3B82F6;--serie-ativ:#64748B;--serie-saida:#7DD3FC;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--background);color:var(--foreground);font:14px/20px var(--font);margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}
h1{font-size:24px;line-height:28px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted-foreground);font-size:14px;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;font-size:12px;line-height:16px;font-weight:500;background:var(--tag-gray);color:var(--tag-gray-fg);white-space:nowrap}
.chip.ok{background:var(--tag-green);color:var(--tag-green-fg)}.chip.warn{background:var(--tag-orange);color:var(--tag-orange-fg)}
.chip.bad{background:var(--tag-red);color:var(--tag-red-fg)}.chip.info{background:var(--tag-blue);color:var(--tag-blue-fg)}
.chip.y{background:var(--tag-yellow);color:var(--tag-yellow-fg)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--background);z-index:5}
nav.tabs button{font:500 14px/20px var(--font);color:var(--muted-foreground);background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs button:hover{color:var(--foreground)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lab{font-size:12px;line-height:16px;font-weight:500;color:var(--muted-foreground)}
.kpi .val{font-size:26px;line-height:30px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .det{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.kpi.bad .val{color:var(--destructive)}.kpi.good .val{color:var(--success)}
.card{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;line-height:24px;font-weight:500;margin:0}
.card .hint{font-size:12px;line-height:16px;color:var(--muted-foreground);margin:-8px 0 0}
section.view{display:flex;flex-direction:column;gap:16px}
.note{border:1px solid var(--border);border-radius:12px;padding:12px 16px;background:var(--muted);color:var(--foreground);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted-foreground)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--muted-foreground);font:11px var(--font)}
svg .v{fill:var(--foreground);font-weight:500}
.tblw{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--muted);color:var(--muted-foreground);font-weight:500;text-align:left;padding:8px 12px;white-space:nowrap;position:sticky;top:0}
td{padding:8px 12px;border-top:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right}
tr:hover td{background:var(--accent)}
a{color:var(--primary)}
.bar{display:grid;grid-template-columns:170px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:14px;background:var(--muted);border-radius:4px;overflow:hidden;display:flex}
.track span{display:block;height:100%}
.bar .num{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
select,input[type=text],input[type=number],input[type=search]{font:14px var(--font);color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:8px;height:36px;padding:0 10px}
input[type=number]{width:96px;text-align:right}
.btn{font:500 14px/20px var(--font);border-radius:8px;height:36px;padding:0 14px;border:1px solid var(--border);background:var(--card);color:var(--foreground);cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn:hover{opacity:.9}.btn[disabled]{opacity:.5;cursor:not-allowed}
.find{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.find:first-of-type{border-top:0}
.find b{font-weight:500}.find p{margin:2px 0 0;color:var(--muted-foreground);font-size:13px}
.verdict{border-radius:16px;padding:20px;border:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.verdict.bad{background:var(--tag-red)}.verdict.good{background:var(--tag-green)}.verdict.warn{background:var(--tag-orange)}
.verdict .big{font-size:20px;line-height:26px;font-weight:600}
.rules{margin:0;padding-left:18px;color:var(--muted-foreground);font-size:13px;display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--foreground);font-weight:500}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--foreground);color:var(--background);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw}
.mono{font-family:var(--mono)}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.bar{grid-template-columns:120px minmax(0,1fr) 56px}.wrap{padding-inline:16px}}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.upd{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
.upd .btn{height:32px;padding:0 12px;font-size:13px}
.upd .btn:disabled{opacity:.55;cursor:not-allowed}
.upd .det{font-size:12px;line-height:16px;color:var(--muted-foreground)}
@media (max-width:900px){.hdr-r{align-items:flex-start}.upd{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Serviços Técnicos · Painel de Gestão</h1>
      <p class="sub">Fila, saúde do time, horas apontadas e S&amp;OP · grupo SRV TECNICO sem Projuris ADV</p>
    </div>
    <div class="hdr-r">
      <div class="upd" id="upd" aria-live="polite"></div>
      <div class="chips" id="fresh"><span class="chip">Carregando bases…</span></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções do painel"></nav>
  <main id="main"><section class="view"><p class="note">Carregando dados…</p></section></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
"use strict";
// ---------------- estado ----------------
const TEAM_DEFAULT=["Matheus Estrogildo Torres Soares","Rodrigo Meireles da Silva","Marcelo Augusto Barbosa Batista Marta","Giovanni Teixeira Ferreira"];
const SHORT={"Matheus Estrogildo Torres Soares":"Matheus Soares","Rodrigo Meireles da Silva":"Rodrigo Meireles","Marcelo Augusto Barbosa Batista Marta":"Marcelo Marta","Giovanni Teixeira Ferreira":"Giovanni Ferreira","Andrei Luis Luis Rhoden":"Andrei Rhoden","Andrei Luis Rhoden":"Andrei Rhoden"};
const DEFAULT_PARAMS={esforco:{"Ativação":1,"Dados":10},fator_produtivo:0.85,meta_ocupacao:0.8,horizonte:3,cenario:"total",time:TEAM_DEFAULT.slice(),horas_mes_padrao:147,squads:{"Dados":["Marcelo Augusto Barbosa Batista Marta","Giovanni Teixeira Ferreira"],"Ativação":["Matheus Estrogildo Torres Soares","Rodrigo Meireles da Silva"]}};
const S={db:null,assets:null,mcp:null,atu:null,mens:null,user:null,canEdit:false,bases:null,params:JSON.parse(JSON.stringify(DEFAULT_PARAMS)),T:null,H:null,C:null,view:"geral",loadErr:null,blFilter:{tipo:"",serv:"",sla:"",dono:"",status:"",q:"",limite:200},loaded:{}};
const TABS=[["geral","Visão geral"],["diag","Diagnóstico da operação"],["sla","SLA"],["backlog","Backlog"],["time","Time"],["horas","Horas"],["sop","S&OP geral"],["squad","S&OP por squad"],["acao","Plano de Ação"],["cfg","Configuração"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(n,d)=>(n==null||!isFinite(n))?"–":Number(n).toLocaleString("pt-BR",{maximumFractionDigits:d||0,minimumFractionDigits:d||0});
const pct=(n,d)=>(n==null||!isFinite(n))?"–":nf(n*100,d||0)+"%";
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const mlab=m=>MES[+m.slice(5,7)-1]+"/"+m.slice(2,4);
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const short=n=>SHORT[n]||n||"";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,4000);}
const TODAY=new Date();const curMonth=TODAY.toISOString().slice(0,7);
const days=(a,b)=>Math.floor(((b||TODAY)-new Date(a))/864e5);
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}
function quant(a,q){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*(s.length-1)))];}
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function addMonths(m,k){const d=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+k,1));return d.toISOString().slice(0,7);}

// ---------------- classificação Dados × Ativação ----------------
// 1) Subtipo ou Tags falam de importação, migração, scripts ou anexos -> Dados
// 2) Subtipo preenchido com outro serviço -> Ativação
// 3) Sem subtipo: Assunto (menos preciso, fica por último)
const KW=/import|migra|script|anexo/;
const KW_ASSUNTO=/import|migra|script|anexo|carga de dados|extracao de dados/;
function classifica(t){
  const st=norm(t.subtipo),tg=norm(t.tags);
  if(KW.test(st))return["Dados","Subtipo"];
  if(KW.test(tg))return["Dados","Tags"];
  if(st.trim())return["Ativação","Subtipo"];
  return KW_ASSUNTO.test(norm(t.assunto))?["Dados","Assunto"]:["Ativação","Assunto"];
}

// Subcategoria de Dados: mesma ordem de precisão (subtipo -> tags -> assunto); script > migração > anexos > dados
// "Importação de Dados e Documentos" conta como Importação de anexos (decisão 29/09)
const SUBS_D=["Importação de dados","Importação de anexos","Scripts","Migrações","Dados (outros)"];
const JANELA_REAL=60,MIN_ESF=1,MIN_AMOSTRA=3;
// Fase 7.1 — tipos de serviço e SLA (dias corridos desde a abertura, sem pausa)
const SERV=["Ativações","Importação de dados","Importação de anexos","Scripts","Migrações","Dados (outros)"];
const SERV_LAB={"Ativações":"Ativações","Importação de dados":"Importações de Dados","Importação de anexos":"Importações de Anexos","Scripts":"Scripts","Migrações":"Migrações","Dados (outros)":"Dados (outros)"};
const SLA_DEF={dias:{"Ativações":7,"Importação de dados":28,"Importação de anexos":14,"Scripts":14,"Migrações":7,"Dados (outros)":14},proximo:0.25};
function slaCfg(){const s=(S.params&&S.params.sla)||{};return {dias:{...SLA_DEF.dias,...(s.dias||{})},proximo:s.proximo!=null?+s.proximo:SLA_DEF.proximo};}
const SLA_LAB={dentro:"Dentro do SLA",proximo:"Próximo do vencimento",vencido:"SLA vencido",no_prazo:"Concluído no prazo",fora_prazo:"Concluído fora do prazo"};
const SLA_CLS={dentro:"ok",proximo:"warn",vencido:"bad",no_prazo:"ok",fora_prazo:"bad"};
function slaResumo(L){const r={n:L.length,dentro:0,proximo:0,vencido:0,vencAtivo:0,vencTerc:0,saldo:0,atrasos:[]};
  for(const t of L){if(r[t.sla]!=null)r[t.sla]++;r.saldo+=t.saldo||0;if(t.sla==="vencido"){r.atrasos.push(t.atraso);if(t.ativo)r.vencAtivo++;else r.vencTerc++;}}
  r.atrasoMed=median(r.atrasos);r.pVenc=r.n?r.vencido/r.n:null;r.pDentro=r.n?r.dentro/r.n:null;return r;}
const fdia=ms=>{if(ms==null)return "–";const d=new Date(ms);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});};
function subDados(t){
  for(const f of [norm(t.subtipo),norm(t.tags),norm(t.assunto)]){
    if(/script/.test(f))return "Scripts";if(/migra/.test(f))return "Migrações";
    if(/dados e documentos/.test(f)||(/documento|arquivo|anexo/.test(f)&&/import|anexo/.test(f)))return "Importação de anexos";
    if(/import|carga de dados/.test(f))return "Importação de dados";
  }
  return "Dados (outros)";
}
// Análise real: tickets concluídos (resolvidos ou fechados) nos últimos N dias, horas apontadas por grupo
function analiseReal(dias){
  const C=S.C,lim=new Date(TODAY-dias*864e5).toISOString().slice(0,10);
  const G=["Ativação",...SUBS_D],o={};
  for(const g of G)o[g]={conc:0,v:[]};
  for(const t of C.T){if(!t.saida||t.saida.slice(0,10)<lim)continue;const g=t.tipo==="Dados"?t.sub:"Ativação";o[g].conc++;if(t.horas>0)o[g].v.push(t.horas);}
  const row=(g,x)=>({g,conc:x.conc,n:x.v.length,tot:x.v.reduce((s,y)=>s+y,0),media:mean(x.v),mediana:median(x.v),p75:quant(x.v,.75),max:x.v.length?Math.max(...x.v):null});
  const rows=G.map(g=>row(g,o[g])).filter(r=>r.conc>0||r.g!=="Dados (outros)");
  const dv=[].concat(...G.slice(1).map(g=>o[g].v));const dados=row("Dados (total)",{conc:G.slice(1).reduce((s,g)=>s+o[g].conc,0),v:dv});
  return {lim,rows,dados};
}

// ---------------- carga ----------------
function rowsOf(tb){const c=tb.colunas;return tb.linhas.map(r=>{const o={};for(let i=0;i<c.length;i++)o[c[i]]=r[i];return o;});}
async function fetchAsset(id){const r=await fetch("/_blob/"+id);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
async function loadBases(){
  const b=S.bases||{};
  try{
    if(b.tickets&&b.tickets.asset&&S.loaded.tickets!==b.tickets.asset){const j=await fetchAsset(b.tickets.asset);S.Tmeta=j.meta;S.T=rowsOf(j);S.loaded.tickets=b.tickets.asset;}
    if(b.horas&&b.horas.asset&&S.loaded.horas!==b.horas.asset){const j=await fetchAsset(b.horas.asset);S.Hmeta=j.meta;S.H={};for(const k in j.tabelas)S.H[k]=rowsOf(j.tabelas[k]);S.loaded.horas=b.horas.asset;}
    S.loadErr=null;
  }catch(e){S.loadErr="Não foi possível ler uma das bases ("+e.message+"). Carregue o arquivo de novo em Configuração.";}
  compute();render();
}

// ---------------- cálculo ----------------
function compute(){
  if(!S.T){S.C=null;return;}
  const P=S.params,team=new Set(P.time||TEAM_DEFAULT);
  const T=S.T.map(t=>{const [tipo,regra]=classifica(t);
    const saida=t.data_resolucao||t.data_fechamento||"";
    return {...t,tipo,regra,sub:tipo==="Dados"?subDados(t):null,dono:team.has(t.agente)?short(t.agente):"Sem responsável ativo",donoFull:t.agente,
      idade:days(t.criado_em),parado:days(t.atualizado_em),noStatus:t.status_desde?days(t.status_desde):null,
      st:String(t.status||"").split(" / ")[0],saida,mesEnt:(t.criado_em||"").slice(0,7),mesSai:saida.slice(0,7)};});
  const byId=new Map(T.map(t=>[String(t.id),t]));
  const BL=T.filter(t=>t.backlog);
  // Horas
  let A=[],hTk=new Map(),months=[],teamH={},capM={},fech=[],ref=[];
  if(S.H){
    A=S.H["Apontamentos"]||[];
    for(const a of A){const k=String(a.ticket_id||"").trim();if(k&&byId.has(k)){hTk.set(k,(hTk.get(k)||0)+(a.horas||0));}}
    for(const a of A){if(!team.has(a.analyst_name))continue;(teamH[a.mes]=teamH[a.mes]||{})[a.analyst_name]=((teamH[a.mes]||{})[a.analyst_name]||0)+(a.horas||0);}
    for(const c of (S.H["Capacidade"]||[])){if(!team.has(c.analyst_name))continue;(capM[c.year_month]=capM[c.year_month]||{})[c.analyst_name]=(c.capacity_seconds||0)/3600;}
    months=[...new Set(A.map(a=>a.mes))].sort();
    fech=(S.H["Fechamento - Analistas"]||[]).filter(f=>team.has(f.analyst_name));
    // meses de referência: meses com apontamento >= 50% da capacidade do time (mês corrente costuma estar atrasado)
    for(const m of months){const h=Object.values(teamH[m]||{}).reduce((s,x)=>s+x,0);const c=Object.values(capM[m]||{}).reduce((s,x)=>s+x,0)||team.size*P.horas_mes_padrao;if(h>=0.5*c&&m<curMonth)ref.push(m);}
    ref=ref.slice(-3);
  }
  for(const t of T)t.horas=hTk.get(String(t.id))||0;
  // esforço real por tipo (tickets que saíram, com horas, criados a partir do 1º mês com apontamento)
  const h0=months[0]||"9999";
  const real={};for(const tp of ["Ativação","Dados"]){const v=T.filter(t=>t.tipo===tp&&t.saida&&t.horas>0&&t.mesEnt>=h0).map(t=>t.horas);real[tp]={n:v.length,media:mean(v),mediana:median(v),p75:quant(v,.75)};}
  // fluxo mensal
  const ano=curMonth.slice(0,4);const fm=[];for(let i=1;i<=+curMonth.slice(5,7);i++)fm.push(ano+"-"+String(i).padStart(2,"0"));
  const fluxo=fm.map(m=>({m,entA:T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.tipo==="Ativação").length,entD:T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.tipo==="Dados").length,sai:T.filter(t=>t.mesSai===m).length}));
  const fechados=fm.filter(m=>m<curMonth).slice(-3);
  const entMed={};for(const tp of ["Ativação","Dados"]){entMed[tp]=mean(fechados.map(m=>T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.tipo===tp).length))||0;}
  const saiMed=mean(fechados.map(m=>T.filter(t=>t.mesSai===m).length))||0;
  // entradas por subcategoria de Dados (tickets/mês, mesmos meses fechados)
  const entSub={};for(const k of SUBS_D)entSub[k]=mean(fechados.map(m=>T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.sub===k).length))||0;
  S.C={T,BL,byId,A,hTk,months,teamH,capM,fech,ref,real,fluxo,fechados,entMed,saiMed,team,entSub};
  // esforço de Dados = média real dos concluídos nos últimos 60 dias por subcategoria, recalculada a cada carga; mínimo 1 h
  const AR=analiseReal(JANELA_REAL);S.C.AR=AR;const fb=+P.esforco["Dados"]||10;const effD={},effSrc={};
  for(const r of AR.rows){if(r.g==="Ativação")continue;const ok=r.n>=MIN_AMOSTRA&&r.media!=null;
    effD[r.g]=Math.max(MIN_ESF,ok?r.media:(r.g==="Dados (outros)"&&AR.dados.media!=null?AR.dados.media:fb));effSrc[r.g]=ok?"real":(r.g==="Dados (outros)"&&AR.dados.media!=null?"média de Dados":"sem amostra");}
  for(const k of SUBS_D)if(effD[k]==null){effD[k]=Math.max(MIN_ESF,k==="Dados (outros)"&&AR.dados.media!=null?AR.dados.media:fb);effSrc[k]=k==="Dados (outros)"&&AR.dados.media!=null?"média de Dados":"sem amostra";}
  S.C.effD=effD;S.C.effSrc=effSrc;
  // ---- Fase 7.1: tipo de serviço, ativo, saldo e SLA por ticket ----
  const SC=slaCfg(),agora=Date.now();
  for(const t of T){
    t.serv=t.tipo==="Dados"?(t.sub||"Dados (outros)"):"Ativações";
    t.ativo=t.backlog?isAtivo(t):false;
    t.esf=esforcoT(t);t.saldo=Math.max(0,t.esf-t.horas);
    t.slaDias=SC.dias[t.serv];const ab=new Date(t.criado_em).getTime();
    t.limite=isNaN(ab)?null:ab+t.slaDias*864e5;t.atraso=0;
    if(t.limite==null)t.sla="sem_data";
    else if(t.backlog){const falta=t.limite-agora;t.atraso=Math.max(0,-falta/864e5);t.sla=falta<0?"vencido":(falta<=t.slaDias*SC.proximo*864e5?"proximo":"dentro");}
    else if(t.saida){const sd=new Date(t.saida).getTime();t.atraso=Math.max(0,(sd-t.limite)/864e5);t.sla=sd<=t.limite?"no_prazo":"fora_prazo";}
    else t.sla="sem_data";
  }
  S.C.slaCfg=SC;
  S.C.sop=sop();
}
// Esforço padrão (Configuração): Ativação 1 h e Dados 10 h por ticket. Os cenários mudam o backlog, não o esforço.
function esforco(tp){return tp==="Dados"?edMedio():(+S.params.esforco[tp]||0);}
// esforço do ticket: Ativação = padrão (1 h); Dados = média real da subcategoria
function esforcoT(t){return t.tipo==="Dados"?S.C.effD[t.sub||"Dados (outros)"]:(+S.params.esforco["Ativação"]||0);}
// horas/mês de entradas do tipo
function entHTipo(tp){const C=S.C;return tp==="Dados"?SUBS_D.reduce((s,k)=>s+C.entSub[k]*C.effD[k],0):C.entMed[tp]*(+S.params.esforco[tp]||0);}
// esforço médio de Dados ponderado pelas entradas
function edMedio(){const C=S.C,n=SUBS_D.reduce((s,k)=>s+C.entSub[k],0);return n?entHTipo("Dados")/n:C.effD["Importação de dados"];}
// Backlog fora da mão do time: depende do cliente, suspenso, com fornecedor ou cancelado
const FORA_RE=/aguardando cliente|validacao do cliente|suspenso|fornecedor|cancelado/;
const isAtivo=t=>!FORA_RE.test(norm(t.st));
const CEN={total:"backlog total",ativo:"backlog ativo"};
const cenKey=()=>S.params.cenario==="ativo"?"ativo":"total";
// S&OP genérico: capacidade de um conjunto de analistas × demanda de um conjunto de tipos
function sopCalc(members,tipos,cen){
  const C=S.C,P=S.params,H=Math.max(1,+P.horizonte||3);const mem=[...members];
  const meses=[];for(let k=0;k<H;k++)meses.push(addMonths(curMonth,k));
  const capMes=meses.map(m=>mem.reduce((s,n)=>s+(((C.capM[m]||{})[n])||P.horas_mes_padrao),0)*(+P.fator_produtivo||0.85));
  const BLall=C.BL.filter(t=>tipos.includes(t.tipo));const BLt=cen==="ativo"?BLall.filter(isAtivo):BLall;
  const blH=BLt.reduce((s,t)=>s+Math.max(0,esforcoT(t)-t.horas),0);
  const entH=tipos.reduce((s,tp)=>s+entHTipo(tp),0);
  const demMes=meses.map(()=>blH/H+entH);
  const cap=capMes.reduce((s,x)=>s+x,0),dem=demMes.reduce((s,x)=>s+x,0);
  const capFTE=mem.length?(cap/H)/mem.length:(P.horas_mes_padrao*(+P.fator_produtivo||0.85));
  const fteNec=(dem/H)/capFTE;const livre=cap/H-entH;
  return {meses,capMes,demMes,blH,entH,cap,dem,saldo:cap-dem,ocup:cap?dem/cap:null,fteNec,fteAtual:mem.length,mesesZerar:livre>0?blH/livre:null,capFTE,
    ea:esforco("Ativação"),ed:esforco("Dados"),nBL:BLt.length,nFora:BLall.length-BLt.length,tipos,membros:mem,cen};
}
function sop(){const out={};for(const cen of ["total","ativo"])out[cen]=sopCalc(S.C.team,["Ativação","Dados"],cen);return out;}
function squads(){const P=S.params,sq=P.squads||DEFAULT_PARAMS.squads,team=S.C.team;const r={};for(const tp of ["Dados","Ativação"])r[tp]=(sq[tp]||[]).filter(n=>team.has(n));return r;}

// ---------------- gráficos (SVG em escala) ----------------
function colChart(data,series,o){o=o||{};const W=o.w||640,Hh=o.h||220,pl=36,pr=8,pt=18,pb=26;const n=data.length;const mx=Math.max(1,...data.map(d=>o.stack?series.reduce((s,se)=>s+(d[se.k]||0),0):Math.max(...series.map(se=>d[se.k]||0))),...(o.line?data.map(d=>d[o.line.k]||0):[0]));
  const nice=niceMax(mx);const y=v=>pt+(Hh-pt-pb)*(1-v/nice);const bw=(W-pl-pr)/n;let g="";
  for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`;}
  data.forEach((d,i)=>{const x0=pl+i*bw;
    if(o.stack){let acc=0;series.forEach(se=>{const v=d[se.k]||0;if(v>0){g+=`<rect x="${x0+bw*.18}" y="${y(acc+v)}" width="${bw*.64}" height="${y(acc)-y(acc+v)}" fill="${se.c}"><title>${esc(se.l)}: ${nf(v,o.dec)}</title></rect>`;}acc+=v;});
      g+=`<text class="v" x="${x0+bw/2}" y="${y(acc)-4}" text-anchor="middle">${nf(acc,o.dec)}</text>`;}
    else{const sw=bw*.72/series.length;series.forEach((se,j)=>{const v=d[se.k]||0;g+=`<rect x="${x0+bw*.14+j*sw}" y="${y(v)}" width="${sw-2}" height="${y(0)-y(v)}" rx="2" fill="${se.c}"><title>${esc(se.l)}: ${nf(v,o.dec)}</title></rect>`;if(o.labels!==false)g+=`<text class="v" x="${x0+bw*.14+j*sw+(sw-2)/2}" y="${y(v)-4}" text-anchor="middle">${nf(v,o.dec)}</text>`;});}
    g+=`<text x="${x0+bw/2}" y="${Hh-8}" text-anchor="middle">${esc(d.lab)}</text>`;});
  if(o.line){const pts=data.map((d,i)=>`${pl+i*bw+bw/2},${y(d[o.line.k]||0)}`).join(" ");g+=`<polyline points="${pts}" fill="none" stroke="${o.line.c}" stroke-width="2" stroke-dasharray="5 4"/>`;data.forEach((d,i)=>{g+=`<circle cx="${pl+i*bw+bw/2}" cy="${y(d[o.line.k]||0)}" r="3" fill="${o.line.c}"><title>${esc(o.line.l)}: ${nf(d[o.line.k],o.dec)}</title></circle>`;});}
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${esc(o.aria||"gráfico")}">${g}</svg>`;}
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function legend(items){return `<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>`;}
function hbars(rows,o){o=o||{};const mx=Math.max(1,...rows.map(r=>r.parts?r.parts.reduce((s,p)=>s+p.v,0):r.v));
  return rows.map(r=>{const tot=r.parts?r.parts.reduce((s,p)=>s+p.v,0):r.v;const segs=(r.parts||[{v:r.v,c:o.c||"var(--primary)"}]).map(p=>`<span style="width:${p.v/mx*100}%;background:${p.c}" title="${esc(p.l||"")}: ${nf(p.v,o.dec)}"></span>`).join("");
    return `<div class="bar"><span class="t" title="${esc(r.l)}">${esc(r.l)}</span><span class="track">${segs}</span><span class="num">${nf(tot,o.dec)}${o.suf||""}</span></div>`;}).join("");}
const kpi=(l,v,d,cls)=>`<div class="kpi ${cls||""}"><span class="lab">${l}</span><span class="val">${v}</span><span class="det">${d||""}</span></div>`;
const CD="var(--serie-dados)",CA="var(--serie-ativ)",CS="var(--serie-saida)";

function diagnostico(){
  const C=S.C,BL=C.BL,P=S.params,F=[];
  const push=(sev,t,d)=>F.push({sev,t,d});
  const ent3=C.entMed["Ativação"]+C.entMed["Dados"];
  if(C.saiMed<ent3)push("bad",`O backlog cresce cerca de ${nf(ent3-C.saiMed)} tickets por mês`,`Entram ${nf(ent3)} e saem ${nf(C.saiMed)} por mês (${C.fechados.map(mlab).join(", ")}).`);
  else push("ok",`Na média dos últimos 3 meses o fluxo está equilibrado`,`Saem ${nf(C.saiMed)} e entram ${nf(ent3)} tickets por mês (${C.fechados.map(mlab).join(", ")}).`);
  const lm=C.fluxo.filter(x=>x.m<curMonth).slice(-1)[0];if(lm){const e=lm.entA+lm.entD;push(lm.sai<e?"bad":"ok",`Em ${mlab(lm.m)} entraram ${nf(e)} e saíram ${nf(lm.sai)} tickets`,lm.sai<e?`O backlog cresceu ${nf(e-lm.sai)} tickets no último mês fechado.`:`O backlog diminuiu ${nf(lm.sai-e)} tickets no último mês fechado.`);}
  const sp=C.sop.total,sr=C.sop.ativo;
  push(sp.saldo<0?"bad":"ok",`Backlog total (${nf(sp.nBL)} tickets): ${sp.saldo<0?"faltam":"sobram"} ${nf(Math.abs(sp.saldo))} h em ${P.horizonte} meses`,`Com ${nf(sp.ea,1)} h por ativação e ${nf(sp.ed,1)} h por ticket de dados (média real por subcategoria) seriam necessárias ${nf(sp.fteNec,1)} pessoas; o time tem ${sp.fteAtual}. Demanda ${nf(sp.dem)} h × capacidade produtiva ${nf(sp.cap)} h.`);
  push(sr.saldo<0?"bad":"ok",`Backlog ativo (${nf(sr.nBL)} tickets, sem os ${nf(sr.nFora)} que dependem do cliente ou de terceiros): ${sr.saldo<0?"faltam":"sobram"} ${nf(Math.abs(sr.saldo))} h`,`Pessoas necessárias: ${nf(sr.fteNec,1)}. As entradas do mês (${nf(sp.entH)} h) pesam mais que o backlog: sozinhas pedem ${nf(sp.entH/sp.capFTE,1)} pessoas.`);
  push("info",`Esforço de Dados pela média real dos últimos ${JANELA_REAL} dias`,SUBS_D.filter(k=>C.entSub[k]||C.BL.some(t=>t.sub===k)).map(k=>`${k}: ${nf(C.effD[k],1)} h`).join(" · ")+` (mínimo de ${MIN_ESF} h por ticket; recalculado a cada carga).`);
  const dD=C.real["Dados"];if(false)push("info",`O esforço real de Dados (${nf(dD.media,1)} h por ticket) está longe do padrão (${nf(P.esforco["Dados"],0)} h)`,`Base: ${dD.n} tickets de dados concluídos com horas apontadas. Mediana ${nf(dD.mediana,1)} h, 75% até ${nf(dD.p75,1)} h. Projetos longos ainda abertos não entram nessa média.`);
  const donos={};BL.forEach(t=>donos[t.dono]=(donos[t.dono]||0)+1);const top=Object.entries(donos).filter(x=>x[0]!=="Sem responsável ativo").sort((a,b)=>b[1]-a[1]);
  if(top.length){const s2=(top[0][1]+(top[1]?top[1][1]:0))/BL.length;push(s2>0.6?"warn":"ok",`${top[0][0]}${top[1]?" e "+top[1][0]:""} concentram ${pct(s2)} do backlog`,top.map(([n,v])=>`${n}: ${v}`).join(" · "));}
  const semDono=BL.filter(t=>t.dono==="Sem responsável ativo");if(semDono.length)push("warn",`${semDono.length} tickets no backlog sem responsável ativo`,`Sem agente, com agente desativado ou fora do time (ex.: Andrei). Redistribuir.`);
  const ag=BL.filter(t=>/aguardando cliente|validacao do cliente/.test(norm(t.st)));const ag90=ag.filter(t=>t.idade>90);
  push(ag.length/BL.length>0.4?"warn":"ok",`${pct(ag.length/BL.length)} do backlog depende do cliente (${ag.length} tickets)`,`${ag90.length} deles têm mais de 90 dias. Uma régua de cobrança e encerramento por inatividade reduziria a fila sem consumir capacidade.`);
  const par=BL.filter(t=>t.parado>30);push(par.length/BL.length>0.3?"warn":"ok",`${par.length} tickets sem movimentação há mais de 30 dias`,`${pct(par.length/BL.length)} do backlog.`);
  const semSub=C.T.filter(t=>!String(t.subtipo||"").trim());push(semSub.length>200?"warn":"ok",`${semSub.length} tickets sem subtipo`,`Nesses a classificação Dados × Ativação vem do assunto, que é menos preciso (${C.T.filter(t=>t.regra==="Assunto").length} tickets classificados pelo assunto).`);
  if(S.H){const last=C.months[C.months.length-1];if(last===curMonth){const h=Object.values(C.teamH[last]||{}).reduce((s,x)=>s+x,0);const c=Object.values(C.capM[last]||{}).reduce((s,x)=>s+x,0);if(c&&h<0.3*c)push("warn",`Apontamento de ${mlab(last)} atrasado: ${nf(h)} h de ${nf(c)} h de capacidade`,`O S&OP e a ocupação usam os meses completos (${C.ref.map(mlab).join(", ")}).`);}
    const semTk=C.A.filter(a=>C.team.has(a.analyst_name)&&!String(a.ticket_id||"").trim()).reduce((s,a)=>s+(a.horas||0),0);const totT=C.A.filter(a=>C.team.has(a.analyst_name)).reduce((s,a)=>s+(a.horas||0),0);
    push("info",`${pct(semTk/totT)} das horas do time não estão ligadas a um ticket`,`${nf(semTk)} h de ${nf(totT)} h (atividades internas, reuniões, apoio).`);
    const fora=[...new Set(C.A.filter(a=>C.team.has(a.analyst_name)&&String(a.ticket_id||"").trim()&&!C.byId.has(String(a.ticket_id).trim())).map(a=>String(a.ticket_id).trim()))];
    push("info",`${fora.length} tickets com horas do time não estão na base de Serviços Técnicos`,`São de outros grupos ou já foram arquivados pelo Freshdesk.`);
    push("info","Horas apontadas começam em "+(C.months[0]?mlab(C.months[0]):"–"),"Antes disso não há registro no Painel de Serviços; o esforço real usa só tickets criados a partir dessa data.");
  }
  push("info","Fechamentos antigos arquivados pelo Freshdesk","Tickets Closed antigos somem da API. Concluídos e entradas de jan–mar estão subcontados; daqui para frente a base preserva o histórico.");
  return F;
}
function vDiag(){
  const C=S.C,sp=C.sop[cenKey()],F=diagnostico();
  const cls=sp.saldo<0?(sp.fteNec-sp.fteAtual>0.5?"bad":"warn"):"good";
  const falta=sp.fteNec-sp.fteAtual;
  const msg=sp.saldo>=0?`Sim. Com ${sp.fteAtual} pessoas, a capacidade cobre a demanda dos próximos ${S.params.horizonte} meses, com folga de ${nf(sp.saldo)} h.`:
    `Não. Faltam ${nf(-sp.saldo)} h nos próximos ${S.params.horizonte} meses, o equivalente a ${nf(Math.max(0,falta),1)} pessoa(s) a mais.`;

const AUTO_ATIV=["Ativação de Serviços (Projuris e Fornecedores)","Criação de Tenant","Alteração de licença","Legal Intelligence - Standard","Legal Intelligence - Alteração de Licença","Cancelamento Parcial (Cancelamento)","Cancelamento Total","Ativação de Módulos"];

const PLANO_DEF={red_ativ:0.6,red_dados:0.3,red_interno:0.25,dias_inatividade:30,meta_sla:0.8,contratar_pessoas:null,contratar_mes:3,auto_pct:1,auto_mes:2};
function plano(){
  const C=S.C,P=S.params,Q={...PLANO_DEF,...(P.plano||{})},H=Math.max(1,+P.horizonte||3),nRef=Math.max(1,C.ref.length);
  const cen=cenKey();const sp=C.sop[cen];const deficitMes=Math.max(0,-sp.saldo/H);
  const refSet=new Set(C.ref);
  // horas reais por subtipo do ticket nos meses de referência (todos os analistas, tickets da base)
  const hSub={},nSub={},hMed={};
  for(const a of C.A){if(!refSet.has(a.mes))continue;const t=C.byId.get(String(a.ticket_id||"").trim());if(!t)continue;const k=t.subtipo||"(sem subtipo)";hSub[k]=(hSub[k]||0)+(a.horas||0);}

   ${rows.map(r=>`<tr><td>${esc(r.k)}${r.src!=="real"?` <span style="color:var(--muted-foreground);font-size:12px">(${r.src})</span>`:""}</td>${td(nf(r.e,1)+" h")}${td(nf(r.nT))}${td(nf(r.hT)+" h")}${td(nf(r.nA))}${td(nf(r.hA)+" h")}${td(nf(r.ent,1))}${td(nf(r.hE)+" h")}</tr>`).join("")}
   <tr style="font-weight:500"><td>Total Dados</td>${td("~"+nf(edMedio(),1)+" h")}${td(nf(T.nT))}${td(nf(T.hT)+" h")}${td(nf(T.nA))}${td(nf(T.hA)+" h")}${td(nf(T.ent,1))}${td(nf(T.hE)+" h")}</tr>

function vSquad(){
  const C=S.C,P=S.params,sq=squads();const cen=cenKey();
  const bloco=tp=>{const mem=new Set(sq[tp]);const outro=tp==="Dados"?"Ativação":"Dados";
    const a=sopCalc(mem,[tp],"total"),b=sopCalc(mem,[tp],"ativo");
    const BLt=C.BL.filter(t=>t.tipo===tp);
    const noSquad=BLt.filter(t=>mem.has(t.donoFull)).length,outroSq=BLt.filter(t=>(sq[outro]||[]).includes(t.donoFull)).length,semDono=BLt.length-noSquad-outroSq;
    const hRef=C.ref.map(m=>C.A.filter(x=>mem.has(x.analyst_name)&&x.mes===m));
    const hTot=hRef.flat().reduce((s,x)=>s+(x.horas||0),0);const hTipo=hRef.flat().filter(x=>{const t=C.byId.get(String(x.ticket_id||"").trim());return t&&t.tipo===tp;}).reduce((s,x)=>s+(x.horas||0),0);
    const hOutro=hRef.flat().filter(x=>{const t=C.byId.get(String(x.ticket_id||"").trim());return t&&t.tipo===outro;}).reduce((s,x)=>s+(x.horas||0),0);
    return `<div class="card" style="gap:16px"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><h2 style="font-size:20px;line-height:24px;font-weight:600">Squad ${tp}</h2><p class="hint" style="margin:4px 0 0">${mem.size?[...mem].map(short).join(" · "):"sem analistas definidos (Configuração)"}</p></div>
      <span class="chip ${(cen==="ativo"?b:a).saldo<0?"bad":"ok"}">${(cen==="ativo"?b:a).saldo<0?"Falta capacidade":"Capacidade suficiente"} · ${CEN[cen]}</span></div>
     <div class="kpis" style="margin:0">
      ${kpi("Backlog "+tp,nf(BLt.length),`${nf(noSquad)} com o squad · ${nf(outroSq)} com o outro squad · ${nf(semDono)} sem responsável ativo`,outroSq+semDono>0?"":"good")}
      ${kpi("Entradas / mês",nf(C.entMed[tp]),`média de ${C.fechados.map(mlab).join(", ")}`)}
      ${kpi("Foco do squad",hTot?pct(hTipo/hTot):"–",`das horas em tickets de ${tp.toLowerCase()} · ${nf(hOutro)} h em ${outro.toLowerCase()} (${C.ref.map(mlab).join(", ")})`)}
     </div>
     ${tp==="Dados"?tabSubDados():""}
     <div class="grid g2">${sopCard(a,"Backlog total",`${nf(a.nBL)} tickets · ${tp==="Dados"?"~"+nf(a.ed,1)+" h por ticket (média real por subcategoria)":nf(a.ea,1)+" h por ticket"}`)}${sopCard(b,"Backlog ativo",`${nf(b.nBL)} tickets (sem ${nf(b.nFora)} que dependem do cliente ou de terceiros) · ${tp==="Dados"?"~"+nf(b.ed,1)+" h por ticket (média real por subcategoria)":nf(b.ea,1)+" h por ticket"}`)}</div></div>`;};
  const tot=["total","ativo"].map(c=>["Dados","Ativação"].reduce((s,tp)=>s+sopCalc(new Set(sq[tp]),[tp],c).saldo,0));
  return `<section class="view">
   <p class="note">Planejamento por tipo de demanda: cada squad atende só o seu tipo com a capacidade dos seus analistas. Quem compõe cada squad é definido em Configuração. Saldo somado dos dois squads: ${(tot[0]>=0?"+":"")+nf(tot[0])} h com o backlog total e ${(tot[1]>=0?"+":"")+nf(tot[1])} h com o backlog ativo, usando ${nf(P.esforco["Ativação"],1)} h por ativação e ${nf(P.esforco["Dados"],1)} h por ticket de dados (o S&amp;OP geral junta toda a demanda e todo o time).</p>
   ${bloco("Dados")}${bloco("Ativação")}
   <div class="card"><h2>Como o S&amp;OP por squad é calculado</h2><ul class="rules">
    <li><b>Capacidade</b> do squad: capacidade do Painel de Serviços dos seus analistas × ${pct(P.fator_produtivo)} de tempo produtivo.</li>
    <li><b>Demanda</b>: o backlog do tipo (esforço do ticket menos as horas já apontadas nele: Ativação ${nf(P.esforco["Ativação"],1)} h; Dados pela média real da subcategoria — importação de dados, importação de anexos, scripts ou migrações), qualquer que seja o responsável atual — inteiro no backlog total; sem os tickets aguardando cliente, suspensos, com fornecedor ou cancelados no backlog ativo — distribuído nos ${P.horizonte} meses, mais a média mensal de entradas do tipo × esforço.</li>
    <li><b>Backlog com o outro squad</b> ou sem responsável ativo indica tickets a redistribuir para o squad certo.</li>
    <li><b>Foco do squad</b>: parcela das horas apontadas pelos analistas do squad em tickets do próprio tipo, nos meses de referência.</li>
   </ul></div></section>`;
}
// ---- Fase 7.2: forecast (3 últimos meses completos ÷ 3) e tendência ----
function forecast(){const C=S.C,M=C.fechados,n=Math.max(1,M.length);
  const esfServ=k=>k==="Ativações"?(+S.params.esforco["Ativação"]||0):C.effD[k];
  const rows=SERV.map(k=>{const v=M.map(m=>C.T.filter(t=>t.novo_no_ano&&t.mesEnt===m&&t.serv===k).length);const fc=v.reduce((a,b)=>a+b,0)/n;
    return {k,v,fc,min:Math.min(...v),max:Math.max(...v),esf:esfServ(k),h:fc*esfServ(k)};}).filter(r=>r.fc>0||r.k!=="Dados (outros)");
  const v=M.map(m=>C.T.filter(t=>t.novo_no_ano&&t.mesEnt===m).length);
  const tot={k:"Total",v,fc:v.reduce((a,b)=>a+b,0)/n,min:Math.min(...v),max:Math.max(...v),h:rows.reduce((a,r)=>a+r.h,0)};tot.esf=tot.fc?tot.h/tot.fc:0;
  const sai=M.map(m=>C.T.filter(t=>t.mesSai===m).length);
  return {meses:M,rows,tot,sai,saiMed:sai.reduce((a,b)=>a+b,0)/n};}
function tendencia(F){const C=S.C,H=Math.max(1,+S.params.horizonte||3),cap=C.sop.total.cap/H;
  const vaz=F.tot.esf?cap/F.tot.esf:0;const out={cap,vaz,cen:{}};
  for(const cen of ["total","ativo"]){const L=cen==="ativo"?C.BL.filter(t=>t.ativo):C.BL;let n=L.length,h=L.reduce((a,t)=>a+t.saldo,0);const serie=[{m:curMonth,n,h}];
    for(let i=1;i<=6;i++){n=Math.max(0,n+F.tot.fc-vaz);h=Math.max(0,h+F.tot.h-cap);serie.push({m:addMonths(curMonth,i),n,h});}
    const d=serie[0].n?(serie[6].n-serie[0].n)/serie[0].n:0;out.cen[cen]={serie,delta:d,selo:d>0.05?"cresce":d<-0.05?"reduz":"estabiliza"};}
  return out;}
const SELO_CLS={cresce:"bad",estabiliza:"warn",reduz:"ok"};
function cardForecast(){const C=S.C,F=forecast(),Tn=tendencia(F),M=F.meses;
  const tr=(r,b)=>`<tr${b?' style="font-weight:500"':""}><td>${esc(r.k==="Total"?"Total":SERV_LAB[r.k])}</td>${r.v.map(x=>`<td class="n">${nf(x)}</td>`).join("")}<td class="n"><b style="font-weight:600">${nf(r.fc,1)}</b></td><td class="n">${nf(r.min)}–${nf(r.max)}</td><td class="n">${nf(r.esf,1)} h</td><td class="n">${nf(r.h)} h</td></tr>`;
  const t=Tn.cen.total,a=Tn.cen.ativo;
  return `<div class="card"><h2>Forecast de novos tickets e tendência do backlog</h2>
   <p class="hint">Forecast = tickets criados nos 3 últimos meses completos (${M.map(mlab).join(", ")}) ÷ 3 · horas = forecast × esforço do tipo · vazão prevista = capacidade produtiva (${nf(Tn.cap)} h/mês) ÷ esforço médio das entradas (${nf(F.tot.esf,2)} h)</p>
   <div class="grid g2" style="align-items:start">
    <div class="tblw"><table><thead><tr><th>Tipo de serviço</th>${M.map(m=>`<th class="n">${mlab(m)}</th>`).join("")}<th class="n">Forecast/mês</th><th class="n">Faixa</th><th class="n">Esforço</th><th class="n">Horas/mês</th></tr></thead><tbody>
     ${F.rows.map(r=>tr(r,false)).join("")}${tr(F.tot,true)}
     <tr><td style="color:var(--muted-foreground)">Saídas observadas</td>${F.sai.map(x=>`<td class="n" style="color:var(--muted-foreground)">${nf(x)}</td>`).join("")}<td class="n" style="color:var(--muted-foreground)">${nf(F.saiMed,1)}</td><td></td><td></td><td></td></tr>
    </tbody></table></div>
    <div>
     <div class="kpis" style="margin:0 0 8px">
      ${kpi("Backlog total em 6 meses",nf(t.serie[6].n)+" tickets",`hoje ${nf(t.serie[0].n)} · <span class="chip ${SELO_CLS[t.selo]}">${t.selo}</span>`,SELO_CLS[t.selo]==="bad"?"bad":"")}
      ${kpi("Backlog ativo em 6 meses",nf(a.serie[6].n)+" tickets",`hoje ${nf(a.serie[0].n)} · <span class="chip ${SELO_CLS[a.selo]}">${a.selo}</span>`,SELO_CLS[a.selo]==="bad"?"bad":"")}
      ${kpi("Entradas × vazão prevista",nf(F.tot.fc)+" × "+nf(Tn.vaz)+"/mês",F.tot.fc>Tn.vaz?`a fila cresce ~${nf(F.tot.fc-Tn.vaz)} tickets/mês`:`a fila cai ~${nf(Tn.vaz-F.tot.fc)} tickets/mês`,F.tot.fc>Tn.vaz?"bad":"good")}
     </div>
     <div class="tblw"><table><thead><tr><th>Mês</th><th class="n">Total (tickets)</th><th class="n">Total (h)</th><th class="n">Ativo (tickets)</th><th class="n">Ativo (h)</th></tr></thead><tbody>
      ${t.serie.map((x,i)=>`<tr><td>${i?mlab(x.m):"hoje"}</td><td class="n">${nf(x.n)}</td><td class="n">${nf(x.h)}</td><td class="n">${nf(a.serie[i].n)}</td><td class="n">${nf(a.serie[i].h)}</td></tr>`).join("")}
     </tbody></table></div>
    </div>
   </div>
   <p class="hint" style="margin:0">Projeção: backlog do mês seguinte = backlog + forecast − vazão prevista (em tickets) e saldo + horas de entrada − capacidade (em horas). "Cresce" ou "reduz" quando a variação em 6 meses passa de 5%. A janela do forecast anda sozinha a cada mês fechado.</p></div>`;}
function capLeitura(A,B){
  const C=S.C,P=S.params,H=Math.max(1,+P.horizonte||3),cap=A.cap/H;
  const eA=entHTipo("Ativação"),eD=entHTipo("Dados");
  const L=[["Capacidade produtiva do time",cap,`${A.fteAtual} pessoas · ${nf(A.capFTE)} h por pessoa`,""],
    ["Entradas de Ativação",eA,`${nf(C.entMed["Ativação"])} tickets/mês × ${nf(A.ea,1)} h`,"d"],
    ["Entradas de Dados",eD,SUBS_D.filter(k=>C.entSub[k]).map(k=>`${k.replace("Importação de ","Imp. ")} ${nf(C.entSub[k],1)} × ${nf(C.effD[k],1)} h`).join(" · "),"d"],
    ["Backlog total ÷ horizonte",A.blH/H,`${nf(A.blH)} h em ${H} meses`,"d"],
    ["Backlog ativo ÷ horizonte",B.blH/H,`${nf(B.blH)} h em ${H} meses`,"d"]];
  const sobra=cap-eA-eD;
  return `<div class="card"><h2>Leitura da capacidade (por mês)</h2><p class="hint">O que cabe na capacidade antes de olhar o backlog · entradas = média de ${C.fechados.map(mlab).join(", ")}</p>
   <div class="grid g2" style="align-items:start">
    <div class="tblw"><table><thead><tr><th>Item</th><th class="n">h/mês</th><th class="n">Pessoas</th><th>Base</th></tr></thead><tbody>
     ${L.map(([l,v,b])=>`<tr><td>${l}</td><td class="n">${nf(v)} h</td><td class="n">${nf(v/A.capFTE,1)}</td><td style="color:var(--muted-foreground);font-size:12px">${b}</td></tr>`).join("")}
     <tr style="font-weight:500"><td>Capacidade − entradas</td><td class="n">${(sobra>=0?"+":"")+nf(sobra)} h</td><td class="n">${nf(sobra/A.capFTE,1)}</td><td style="color:var(--muted-foreground);font-size:12px">${sobra>=0?"folga para reduzir o backlog":"as entradas já superam a capacidade: o backlog cresce"}</td></tr>
    </tbody></table></div>
    <div>${hbars([{l:"Capacidade",v:cap},{l:"Entradas Ativação",v:eA},{l:"Entradas Dados",v:eD},{l:"Backlog total/mês",v:A.blH/H},{l:"Backlog ativo/mês",v:B.blH/H}],{suf:" h"})}</div>
   </div></div>`;
}
function vSop(){
  const C=S.C,P=S.params,A=C.sop.total,B=C.sop.ativo;
  const col=(x,t)=>`<div class="card"><h2>${t}</h2><p class="hint">${nf(x.nBL)} tickets no backlog${x.nFora?` (sem ${nf(x.nFora)} que dependem do cliente ou de terceiros)`:""} · ${nf(x.ea,1)} h por ativação · ${nf(x.ed,1)} h por ticket de dados (média real por subcategoria)</p>
   <div class="kpis" style="margin:0">${kpi("Capacidade produtiva",nf(x.cap)+" h",`${P.horizonte} meses · ${pct(P.fator_produtivo)} da capacidade do Painel`)}${kpi("Demanda",nf(x.dem)+" h",`backlog ${nf(x.blH)} h + entradas ${nf(x.entH)} h/mês`)}
   ${kpi("Saldo",(x.saldo>=0?"+":"")+nf(x.saldo)+" h",x.saldo>=0?"sobra":"falta",x.saldo<0?"bad":"good")}${kpi("Pessoas necessárias",nf(x.fteNec,1),`time atual: ${x.fteAtual}`,x.fteNec>x.fteAtual?"bad":"good")}</div>
   ${legend([["var(--primary)","Capacidade"],[CD,"Demanda"]])}
   ${colChart(x.meses.map((m,i)=>({lab:mlab(m),c:x.capMes[i],d:x.demMes[i]})),[{k:"c",c:"var(--primary)",l:"Capacidade"},{k:"d",c:"var(--serie-saida)",l:"Demanda"}],{h:200,aria:"Capacidade e demanda"})}
   <p class="hint" style="margin:0">${x.mesesZerar!=null?`Com as entradas atuais, a folga zera o backlog em ~${nf(x.mesesZerar,1)} meses.`:"As entradas mensais já consomem toda a capacidade: o backlog não diminui."}</p></div>`;
  return `<section class="view">
   <p class="note">S&amp;OP geral: todos os tickets de Serviços Técnicos × todos os analistas do time (${[...C.team].map(short).join(", ")}). A visão por tipo de demanda está em “S&amp;OP por squad”.</p>
   <div class="grid g2">${col(A,"Cenário 1 · backlog total")}${col(B,"Cenário 2 · backlog ativo")}</div>
   ${cardForecast()}
   ${capLeitura(A,B)}
   <div class="card"><h2>Como o S&amp;OP é calculado</h2><ul class="rules">
    <li><b>Capacidade</b>: capacidade mensal de cada analista do time no Painel de Serviços (já considera dias úteis e férias) × ${pct(P.fator_produtivo)} de tempo produtivo. Sem capacidade cadastrada no mês, usa ${P.horas_mes_padrao} h por pessoa.</li>
    <li><b>Backlog</b>: para cada ticket aberto, o esforço do ticket (${nf(P.esforco["Ativação"],1)} h por ativação, editável em Configuração; Dados pela média real dos últimos ${JANELA_REAL} dias da subcategoria: ${SUBS_D.filter(k=>C.entSub[k]||C.BL.some(t=>t.sub===k)).map(k=>`${k.toLowerCase()} ${nf(C.effD[k],1)} h`).join(", ")}, mínimo ${MIN_ESF} h) menos as horas já apontadas nele; o total é distribuído igualmente nos ${P.horizonte} meses.</li>
    <li><b>Cenários</b>: o <b>backlog total</b> conta todos os tickets abertos; o <b>backlog ativo</b> tira os que estão aguardando o cliente (ou a validação dele), suspensos, com fornecedor ou cancelados — mede o trabalho que o time consegue tocar agora.</li>
    <li><b>Entradas previstas</b>: média mensal de tickets novos nos meses fechados (${C.fechados.map(mlab).join(", ")}): ${nf(C.entMed["Ativação"])} de ativação e ${nf(C.entMed["Dados"])} de dados, cada subcategoria × o seu esforço.</li>
    <li>O esforço real apontado (abas Horas e Plano de Ação) fica como referência de calibração; não entra no S&amp;OP.</li>
    <li><b>Pessoas necessárias</b> = demanda média mensal ÷ capacidade produtiva média por pessoa (${nf(A.capFTE)} h/mês).</li>
   </ul></div></section>`;
}

function drawTabs(){$("#tabs").innerHTML=TABS.map(([v,l])=>`<button role="tab" data-v="${v}" aria-selected="${S.view===v}">${esc(l)}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;try{localStorage.setItem("st_view",S.view);}catch(e){}render();});}
function drawFresh(){const b=S.bases||{},el=$("#fresh");if(!b.tickets&&!b.horas){el.innerHTML=`<span class="chip warn">Bases não carregadas</span>`;return;}
  const age=x=>x&&x.gerado_em?Math.floor((Date.now()-new Date(x.gerado_em))/36e5):null;
  const c=(x,l)=>{if(!x)return `<span class="chip warn">${l}: sem carga</span>`;const h=age(x);return `<span class="chip ${h>30?"warn":"ok"}">${l}: ${esc((x.gerado_em||"").slice(8,10)+"/"+(x.gerado_em||"").slice(5,7)+" "+(x.gerado_em||"").slice(11,16))} UTC</span>`;};
  el.innerHTML=c(b.tickets,"Tickets")+c(b.horas,"Horas")+(S.C?`<span class="chip">Time: ${[...S.C.team].map(short).join(", ")}</span>`:"");}
// ---------------- botão Atualizar (Fase 5) ----------------
// Clique -> grava o pedido em cfg/atualizacao e agenda a tarefa "Mensageiro do painel" para o minuto seguinte.
// O mensageiro (tarefa agendada do Claude, ligada ao computador do Diego) entrega o pedido ao vigia do Windows,
// acompanha a extração e carrega as bases novas aqui (cfg/bases). Hibernação: 5 h após sucesso, 15 min após falha.
const OCUPADO=["na_fila","aguardando_computador","atualizando","carregando"];
const hm=iso=>{const d=new Date(iso);return isNaN(d)?"–":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};
const dhm=iso=>{const d=new Date(iso);if(isNaN(d))return "–";const hoje=new Date().toDateString()===d.toDateString();return hoje?hm(iso):d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});};
function horaSP(){const p=new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const g=t=>+(p.find(x=>x.type===t)||{}).value;return g("hour")*60+g("minute");}
function estadoAtu(){
  const A=S.atu||{},agora=Date.now();
  const recente=A.atualizado_em&&agora-new Date(A.atualizado_em)<25*60e3;
  if(OCUPADO.includes(A.status)&&recente){
    const txt={na_fila:`Na fila · começa às ${hm(A.agendado_para)}`,aguardando_computador:"Pedido entregue ao computador · aguardando o vigia (até 5 min)",atualizando:`Atualizando no computador · ${A.etapa||"extração"}`,carregando:"Carregando as bases no painel"}[A.status];
    return {cls:"info",txt,pode:false};}
  const lib=A.proximo_liberado_em?new Date(A.proximo_liberado_em):null;
  if(lib&&agora<lib){
    if(A.status==="erro")return {cls:"bad",txt:`Falhou: ${A.detalhe||"ver log"} · nova tentativa às ${hm(A.proximo_liberado_em)}`,pode:false};
    return {cls:"",txt:`Hibernando até ${dhm(A.proximo_liberado_em)}`,pode:false};}
  const m=horaSP();if(m<7*60||m>21*60+40)return {cls:"",txt:"Disponível das 07:00 às 21:40 (o computador atende nesse horário)",pode:false};
  if(A.status==="erro")return {cls:"warn",txt:`Última tentativa falhou: ${A.detalhe||"ver log"}`,pode:true};
  return {cls:"ok",txt:"Disponível",pode:true};}
function drawUpd(){const el=$("#upd");if(!el)return;const A=S.atu||{},E=estadoAtu();
  const podeUsar=S.canEdit&&S.mcp&&S.mens&&S.mens.trigger_id;
  const ult=A.ultimo_sucesso?`Última atualização: ${dhm(A.ultimo_sucesso)}${A.origem?" ("+(A.origem==="botao"?"botão":"agendada")+")":""}`:"";
  el.innerHTML=(podeUsar?`<button class="btn pri" id="btnAtu" ${E.pode?"":"disabled"} title="Roda as extrações no computador do Diego e carrega as bases novas (leva de 10 a 15 min)">Atualizar</button>`:"")+
    `<span class="chip ${E.cls}">${esc(E.txt)}</span>`+(ult?`<span class="det">${esc(ult)}</span>`:"");
  const b=$("#btnAtu");if(b)b.onclick=atualizar;}
async function atualizar(){const b=$("#btnAtu");if(b)b.disabled=true;
  const E=estadoAtu();if(!E.pode){drawUpd();return;}
  const t=new Date(Date.now()+60e3);t.setUTCSeconds(0,0);t.setUTCMinutes(t.getUTCMinutes()+1);
  const quando=t.toISOString().replace(".000Z","Z");const agora=new Date().toISOString();
  const pedido={...(S.atu||{}),status:"na_fila",etapa:"aguardando o mensageiro",origem:"botao",pedido_id:"btn-"+Date.now().toString(36),pedido_em:agora,agendado_para:quando,detalhe:"",atualizado_em:agora};
  try{await S.db.doc("cfg/atualizacao").set(pedido);}catch(e){toast("Não foi possível registrar o pedido.");drawUpd();return;}
  try{await S.mcp.callTool("Claude Code Remote","update_trigger",{trigger_id:S.mens.trigger_id,run_once_at:quando,enabled:true},{cache:false});
    toast("Atualização pedida. Começa às "+hm(quando)+" e leva de 10 a 15 min.");}
  catch(e){const c=e&&e.code;
    const msg={server_not_connected:"conector Claude Code Remote não conectado",needs_reauth:"reconecte o Claude Code Remote",not_in_manifest:"permissão do conector recusada",cancelled:"pedido cancelado",tool_error:"a tarefa recusou o agendamento"}[c]||("erro ao agendar"+(c?" ("+c+")":""));
    try{await S.db.doc("cfg/atualizacao").set({...pedido,status:"erro",etapa:"agendamento",detalhe:msg,atualizado_em:new Date().toISOString(),proximo_liberado_em:(S.atu||{}).proximo_liberado_em||null});}catch(_){}
    toast("Não foi possível pedir a atualização: "+msg+".");}}
setInterval(()=>{if(S.atu)drawUpd();},30e3);

function render(){drawTabs();drawFresh();drawUpd();const m=$("#main");
  if(S.loadErr){m.innerHTML=`<section class="view"><p class="note">${esc(S.loadErr)}</p></section>`+(S.view==="cfg"?vCfg():"");bind();return;}
  if(!S.db&&S.ready){m.innerHTML=`<section class="view"><p class="note">Este painel lê as bases do banco do artefato. Abra-o no Claude, com sua conta da organização.</p></section>`;return;}
  if(!S.C){m.innerHTML=S.ready?`<section class="view"><p class="note">Nenhuma base carregada ainda. Em Configuração, carregue <span class="mono">base_servicos_tecnicos.json</span> e <span class="mono">horas_apontadas_&lt;ano&gt;_painel.json</span>.</p></section>`+(S.view==="cfg"?vCfg():""):`<section class="view"><p class="note">Carregando dados…</p></section>`;bind();return;}
  m.innerHTML=({geral:vGeral,diag:vDiag,sla:vSla,backlog:vBacklog,time:vTime,horas:vHoras,sop:vSop,squad:vSquad,acao:vAcao,cfg:vCfg}[S.view]||vGeral)();bind();}
function bind(){
  const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e[ev]=fn;};
  ["tipo","serv","sla","dono","status"].forEach(k=>on("f_"+k,"onchange",e=>{S.blFilter[k]=e.target.value;S.blFilter.limite=200;render();}));
  on("f_q","oninput",e=>{clearTimeout(bind._q);const v=e.target.value;bind._q=setTimeout(()=>{S.blFilter.q=v;render();const n=$("#f_q");if(n){n.focus();n.setSelectionRange(v.length,v.length);}},300);});
  on("f_more","onclick",()=>{S.blFilter.limite+=300;render();});
  on("f_csv","onclick",exportCsv);
  on("p_save","onclick",saveParams);
  on("a_save","onclick",saveAcao);
  on("up_file","onchange",e=>upload(e.target.files[0]));
}
async function exportCsv(){const dl=await window.claude?.use?.("downloads");if(!dl){toast("Download indisponível nesta visualização.");return;}
  const L=blFiltered();const head=["Ticket","Assunto","Tipo","Regra","Status","Responsável","Subtipo","Tipo de serviço","Situação do SLA","Data limite","Dias de atraso","Idade (dias)","Parado (dias)","Horas apontadas","Saldo (h)"];
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv="﻿"+[head.join(";")].concat(L.map(t=>[t.id,t.assunto,t.tipo,t.regra,t.st,t.dono,t.subtipo,SERV_LAB[t.serv],SLA_LAB[t.sla]||"",t.limite?new Date(t.limite).toISOString().slice(0,10):"",Math.round(t.atraso),t.idade,t.parado,String(t.horas.toFixed(2)).replace(".",","),String(t.saldo.toFixed(2)).replace(".",",")].map(q).join(";"))).join("\r\n");
  try{await dl.save({filename:"backlog_servicos_tecnicos.csv",data:new Blob([csv],{type:"text/csv"})});}catch(e){toast("Download não concluído.");}}
async function saveParams(){if(!S.db)return;const g=id=>+document.getElementById(id).value;
  const time=[...document.querySelectorAll("input[id^=tm_]")].filter(i=>i.checked).map(i=>i.dataset.n);
  const p={...S.params,esforco:{"Ativação":g("p_ea"),"Dados":g("p_ed")},fator_produtivo:g("p_fp")/100,horizonte:g("p_hz"),horas_mes_padrao:g("p_hp"),cenario:document.getElementById("p_cen").value,time,atualizado_em:new Date().toISOString()};
  const squads={"Dados":[],"Ativação":[]};document.querySelectorAll("select[id^=sq_]").forEach(e=>{if(e.value&&squads[e.value]&&time.includes(e.dataset.n))squads[e.value].push(e.dataset.n);});p.squads=squads;
  const dias={};document.querySelectorAll("input[id^=sl_]").forEach(e=>{if(e.dataset.k)dias[e.dataset.k]=Math.max(1,+e.value||SLA_DEF.dias[e.dataset.k]);});
  const px=document.getElementById("sl_px");p.sla={dias,proximo:px?Math.min(0.75,Math.max(0.05,(+px.value||25)/100)):SLA_DEF.proximo};
  if(!time.length){toast("Selecione ao menos uma pessoa no time.");return;}
  try{await S.db.doc("cfg/params").set(p);toast("Parâmetros salvos");}catch(e){toast(e&&e.code==="invalid_argument"?"Você não tem permissão para alterar os parâmetros.":"Não foi possível salvar. Tente de novo.");}}
async function upload(file){if(!file||!S.assets||!S.db)return;
  let j;try{j=JSON.parse(await file.text());}catch(e){toast("O arquivo não é um JSON válido.");return;}
  const kind=j.tabelas&&j.tabelas["Apontamentos"]?"horas":(j.colunas&&j.linhas?"tickets":null);
  if(!kind){toast("Arquivo não reconhecido. Use base_servicos_tecnicos.json ou horas_apontadas_<ano>_painel.json.");return;}
  toast("Enviando "+(kind==="horas"?"base de horas":"base de tickets")+"…");
  try{const r=await S.assets.upload(file,{type:"application/json"});const old=(S.bases||{})[kind];
    const meta=j.meta||{};const linhas=kind==="horas"?(j.tabelas["Apontamentos"].linhas||[]).length:j.linhas.length;
    const doc={...(S.bases||{}),[kind]:{asset:r.id,gerado_em:meta.gerado_em||"",linhas,enviado_em:new Date().toISOString(),arquivo:file.name}};
    await S.db.doc("cfg/bases").set(doc);
    if(old&&old.asset&&old.asset!==r.id){try{await S.assets.delete(old.asset);}catch(e){}}
    toast("Base carregada");}
  catch(e){toast({too_large:"Arquivo acima de 20 MB.",rate_limited:"Muitas tentativas; aguarde um pouco.",not_granted:"Sem permissão para carregar arquivos."}[e&&e.code]||"Não foi possível carregar o arquivo.");}}

// ---------------- boot ----------------
try{const v=localStorage.getItem("st_view");if(v&&TABS.some(t=>t[0]===v))S.view=v;}catch(e){}
if(/^#[a-z]+$/.test(location.hash)&&TABS.some(t=>"#"+t[0]===location.hash))S.view=location.hash.slice(1);
render();
(async function boot(){const c=window.claude;
  const [db,user]=await Promise.all([c?.use?.("db")??null,c?.use?.("user")??null]);
  S.db=db;S.user=user;S.ready=true;
  if(user){try{S.canEdit=await user.canEdit();}catch(e){}}
  if(S.canEdit){c?.use?.("assets").then(a=>{S.assets=a;if(S.view==="cfg")render();}).catch(()=>{});
    c?.use?.("mcp").then(m=>{S.mcp=m;drawUpd();}).catch(()=>{});}
  if(!db){render();return;}
  db.doc("cfg/params").onSnapshot(s=>{S.params=s.exists?{...JSON.parse(JSON.stringify(DEFAULT_PARAMS)),...s.data()}:JSON.parse(JSON.stringify(DEFAULT_PARAMS));if(S.T){compute();}render();},()=>{});
  db.doc("cfg/atualizacao").onSnapshot(s=>{S.atu=s.exists?s.data():null;drawUpd();},()=>{});
  db.doc("cfg/mensageiro").onSnapshot(s=>{S.mens=s.exists?s.data():null;drawUpd();},()=>{});
  db.doc("cfg/bases").onSnapshot(s=>{S.bases=s.exists?s.data():null;loadBases();},()=>{S.loadErr="Não foi possível ler o banco do painel.";render();});
})();
})();
</script>
